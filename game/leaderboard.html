<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дошки пошани — Тімолінго</title>
<link rel="stylesheet" href="game.css?v=20261118k">
</head>
<body>
<div class="story-deco" aria-hidden="true"><span>🍄</span><span>🌿</span><span>✨</span></div>
<aside class="side" id="side"></aside>

<main class="main">
  <div class="wrap">
    <div class="hud" id="hud"></div>
    <div class="league-scene" id="leagueScene"></div>
    <div id="board"></div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="tasks.js?v=20261118k"></script>
<script src="avatars.js?v=20261118k"></script>
<script src="game.js?v=20261118k"></script>
<script>
(function () {
  Game.renderSidebar("board");
  document.getElementById("hud").innerHTML = Game.hudHTML();
  var EMOJI = ["🐸", "🦎", "🐛", "🐌", "🦋", "🐞", "🐢", "🐝", "🦊", "🐼", "🐨", "🐯", "🦁", "🐮"];
  var AVATARS = (window.AVATARS && window.AVATARS.length) ? window.AVATARS : [];
  function botAvatar(i) {
    if (AVATARS.length) {
      var a = AVATARS[(i * 7 + 3) % AVATARS.length];
      return '<img src="' + a.file + '" alt="" title="' + Game.esc(a.name) + '" style="width:30px;height:30px;' +
             'border-radius:50%;object-fit:cover;display:block">';
    }
    return EMOJI[i % EMOJI.length];
  }

  function render() {
    var p = Game.load();
    var lg = Game.leagueOf(p);
    var lb = Game.weekLeaderboard(p);
    var host = document.getElementById("board");

    var scene = document.getElementById("leagueScene");
    if (scene) {
      scene.style.backgroundImage = 'linear-gradient(180deg, rgba(18,14,11,.12), rgba(18,14,11,.90)), url("' +
        lg.cur.city + '?v=20261118k")';
      scene.innerHTML = '<div class="ls-kicker">Казкове місто</div><h1>' + lg.cur.name + ' ліга</h1>' +
        '<div class="ls-sub">Ваш герб і ваше місто цього тижня</div>';
    }

    var html = '<div class="sec-head purple"><div class="sh-emoji"><img class="league-crest" src="' +
      lg.cur.crest + '?v=20261118k" alt=""></div>' +
      '<div><div class="sh-kicker">Загальний залік</div>' +
      '<h2>' + lg.cur.name + ' ліга</h2></div>' +
      '<div class="sh-bar"><div>' + p.xp + ' XP</div></div></div>';

    html += '<div class="card"><h3>Місце у лізі <span class="more" style="color:' +
      (lb.promote ? "#58cc02" : "#999") + '">' +
      (lb.promote ? "зона підвищення" : "спокійна зона") +
      '</span></h3>';

    lb.list.forEach(function (row, i) {
      if (i === 10) { html += '<div class="zone">↑ вище — підвищення</div>'; }
      html += '<div class="lb-row' + (row.me ? " me" : "") + '">' +
        '<div class="rank">' + (i + 1) + '</div>' +
        '<div class="av">' + (row.me ? Game.avatarMarkup(p.profile.avatar, 30) : botAvatar(i)) + '</div>' +
        '<div class="nm">' + Game.esc(row.name) + '</div>' +
        '<div class="x">' + row.xp + ' XP</div></div>';
    });
    html += '</div>';
    html += '<div class="muted" style="font-size:11px;font-weight:700;margin:-6px 0 16px 4px">' +
            'Місце в таблиці — за XP, заробленим цього тижня (' + (p.weekXp || 0) + ' XP). Ліга — за загальним XP.</div>';

    html += '<div class="card" style="margin-top:16px"><h3>Ліги</h3>';
    Game.LEAGUES.forEach(function (l, i) {
      html += '<div class="tier' + (i === lg.index ? " on" : "") + '" style="--tc:' + l.color + '">' +
        '<div class="te"><img class="league-crest sm" src="' + l.crest + '?v=20261118k" alt=""></div><div><b>' + l.name + ' ліга</b>' +
        '<div class="muted" style="font-size:12px">' + (i === lg.index ? "твоя ліга зараз" : "потрібно " + l.need + " XP усього") +
        '</div></div><div class="need">' + l.need + ' XP</div></div>';
    });
    html += '</div>';

    host.innerHTML = html;
  }

  render();
})();
</script>
</body>
</html>
