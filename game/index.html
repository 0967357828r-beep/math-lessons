<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачі-мультфільми — гра</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 14px 90px; min-height: 100vh; overflow-x: hidden;
    font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif; color: #3a2d1f;
    background: linear-gradient(180deg, #9fe3ff 0%, #cdf3ff 34%, #eafbd6 68%, #d7efb2 100%);
  }
  header { max-width: 760px; margin: 0 auto 14px; text-align: center; }
  h1 { font-size: clamp(24px, 5vw, 36px); margin: 0 0 6px; color: #ff5c8a;
       text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(255,209,102,.7); }
  .sub { margin: 0; color: #5a6b52; font-size: 15px; }
  .hud { max-width: 760px; margin: 0 auto 18px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chip { background: #fffdf7; border: 4px solid #ffd166; border-radius: 18px; padding: 8px 14px;
          font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px;
          box-shadow: 0 6px 0 rgba(0,0,0,.07); }
  .chip.xp { border-color: #8ecae6; }
  .chip.streak { border-color: #ffa45c; }
  .chip.gems { border-color: #7ee0b8; }
  .chip.lives { border-color: #ff8fab; }
  .path { max-width: 520px; margin: 0 auto; position: relative; padding: 10px 0 20px; }
  .path::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 8px;
    transform: translateX(-50%); border-radius: 8px;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.9) 0 14px, rgba(255,255,255,.35) 14px 28px);
  }
  .step { position: relative; display: flex; justify-content: center; margin: 0 0 26px; }
  .step:nth-child(4n+1) { transform: translateX(-120px); }
  .step:nth-child(4n+2) { transform: translateX(-40px); }
  .step:nth-child(4n+3) { transform: translateX(40px); }
  .step:nth-child(4n+4) { transform: translateX(120px); }
  .lvl { width: 110px; text-align: center; cursor: pointer; text-decoration: none; color: inherit;
         display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .dot { width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center;
         justify-content: center; font-size: 30px; border: 6px solid #fff;
         box-shadow: 0 8px 0 rgba(0,0,0,.12); background: #d7e3ea; color: #7c8b93;
         transition: transform .15s ease; }
  .lvl.open .dot { background: #ffe08a; color: #7a5b12; animation: pulse 1.6s ease-in-out infinite; }
  .lvl.done .dot { background: #7ee0b8; color: #1f6b4c; }
  .lvl:hover .dot { transform: translateY(-3px) scale(1.04); }
  .lvl .cap { font-size: 12px; line-height: 1.2; color: #5a6b52; max-width: 110px; }
  .lvl .st { font-size: 13px; letter-spacing: 1px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 8px 0 rgba(0,0,0,.12), 0 0 0 0 rgba(255,196,0,.6); }
                     50% { box-shadow: 0 8px 0 rgba(0,0,0,.12), 0 0 0 14px rgba(255,196,0,0); } }
  .chest .dot { background: #ffd9a0; border-color: #ffb347; color: #8a5a12;
                animation: chestBob 1.8s ease-in-out infinite; }
  .chest .cap { color: #a5661f; font-weight: 700; }
  @keyframes chestBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  .char { position: absolute; font-size: 62px; line-height: 1; pointer-events: none; z-index: 2;
          animation: charFloat 3.2s ease-in-out infinite;
          filter: drop-shadow(0 3px 3px rgba(0,0,0,.2)); }
  .char.left { left: -46px; top: -2px; }
  .char.right { right: -46px; top: -2px; }
  @keyframes charFloat { 0%,100% { transform: translateY(0) rotate(-5deg) } 50% { transform: translateY(-7px) rotate(5deg) } }
  .banner { max-width: 760px; margin: 0 auto 16px; background: #ffe3e9; border: 4px solid #ff8fab;
            border-radius: 18px; padding: 12px 16px; text-align: center; font-weight: 700; color: #a3284d;
            display: none; }
  .banner.show { display: block; }
  .tools { max-width: 760px; margin: 26px auto 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button.tool { border: 4px solid #c9a7ff; background: #fff; color: #5a4a7a; font: 700 14px inherit;
                border-radius: 14px; padding: 8px 14px; cursor: pointer; }
  button.tool:hover { background: #f4ecff; }
  a.tool { text-decoration: none; }
  footer { max-width: 760px; margin: 26px auto 0; text-align: center; color: #7b8a71; font-size: 13px; }
  a.plain { color: #ff5c8a; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
           background: #3a2d1f; color: #fff; padding: 10px 16px; border-radius: 14px; opacity: 0;
           transition: all .25s ease; font-size: 14px; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>🎮 Задачі-мультфільми</h1>
  <p class="sub">Один крок — одна задача. Правильна відповідь дає кристал 💎, помилка забирає життя ❤️.<br>Дорогою трапляються скрині 🧰 — у них буває життя або кілька кристалів.</p>
</header>

<div class="hud">
  <div class="chip lives">❤️ <span id="lives">10</span> / 10</div>
  <div class="chip gems">💎 <span id="gems">0</span></div>
  <div class="chip xp">⚡ XP: <span id="xp">0</span></div>
  <div class="chip streak">🔥 Серія: <span id="streak">0</span> дн.</div>
</div>

<div class="banner" id="banner"></div>
<div class="path" id="path"></div>

<div class="tools">
  <button class="tool" id="heal">Відновити життя (3 💎)</button>
  <button class="tool" id="reset">Скинути прогрес</button>
  <button class="tool" id="export">Зберегти прогрес</button>
  <button class="tool" id="import">Завантажити прогрес</button>
  <a class="tool" style="border-color:#8ecae6;color:#2b5d75" href="../index.html">📚 Бібліотека</a>
</div>

<footer>Прогрес зберігається у цьому браузері · життя відновлюються щодня</footer>
<div class="toast" id="toast"></div>

<script src="tasks.js"></script>
<script>
const KEY = "mathgame_v1";
const MAX_LIVES = 10;
const todayStr = () => new Date().toISOString().slice(0, 10);

function load() {
  let p;
  try { p = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { p = {}; }
  p.levels = p.levels || {};
  p.xp = p.xp || 0;
  p.streak = p.streak || 0;
  p.last = p.last || null;
  p.gems = p.gems || 0;
  p.lives = typeof p.lives === "number" ? p.lives : MAX_LIVES;
  p.livesDate = p.livesDate || todayStr();
  Object.keys(p.levels).forEach(k => {
    const l = p.levels[k];
    if (typeof l.gems !== "number") { l.gems = l.stars || 0; }
    delete l.stars;
  });
  if (p.livesDate !== todayStr()) { p.lives = MAX_LIVES; p.livesDate = todayStr(); }
  return p;
}
function save(p) { localStorage.setItem(KEY, JSON.stringify(p)); }

function isDone(p, id) { return !!(p.levels[id] && p.levels[id].done); }
function gemsOf(p, id) { return (p.levels[id] && p.levels[id].gems) || 0; }
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

const CHARS = ["🐸", "🦎", "🐛", "🐌", "🦋", "🐞"];
function characterFor(idx) { return idx % 6 === 2 ? CHARS[Math.floor(idx / 6) % CHARS.length] : null; }

function chestsOf(p) {
  if (p.chestsV === 3 && Array.isArray(p.chests)) { return p.chests; }
  const n = window.TASKS.length;
  const list = [];
  const count = Math.max(4, Math.round(n / 6));
  const used = new Set();
  let guard = 0;
  while (list.length < count && guard < 800) {
    guard++;
    const i = 2 + Math.floor(Math.random() * Math.max(1, n - 3));
    if (used.has(i)) { continue; }
    if (isDone(p, window.TASKS[i].id)) { continue; }
    used.add(i);
    list.push({ i: i, kind: Math.random() < 0.55 ? "life" : "gems", opened: false });
  }
  p.chests = list.sort((a, b) => a.i - b.i);
  // хоча б одна скриня попереду поточного кроку
  const firstOpen = window.TASKS.findIndex(t => !isDone(p, t.id));
  if (firstOpen >= 0) {
    const near = p.chests.some(c => c.i >= firstOpen && c.i <= firstOpen + 4);
    if (!near) {
      const at = Math.min(firstOpen + 2, n - 1);
      if (!p.chests.some(c => c.i === at)) {
        p.chests.push({ i: at, kind: Math.random() < 0.6 ? "life" : "gems", opened: false });
        p.chests.sort((a, b) => a.i - b.i);
      }
    }
  }
  p.chestsV = 3;
  return p.chests;
}

function chime(freqs) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return; }
    const ctx = chime.ctx || (chime.ctx = new AC());
    freqs.forEach((f, k) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const t0 = ctx.currentTime + k * 0.09;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + 0.32);
    });
  } catch (e) {}
}

function openChest(p, chest) {
  chest.opened = true;
  let msg;
  if (chest.kind === "life") {
    if (p.lives < MAX_LIVES) { p.lives += 1; msg = "❤️ У скрині життя! +1 життя"; }
    else { p.gems += 2; msg = "💎 Життя повні — натомість +2 кристали"; }
  } else {
    const add = 1 + Math.floor(Math.random() * 2);
    p.gems += add; msg = "💎 У скрині кристали! +" + add;
  }
  save(p); chime([660, 880, 1180]); render(); toast(msg);
}

function render() {
  const p = load(); save(p);
  document.getElementById("xp").textContent = p.xp;
  document.getElementById("streak").textContent = p.streak;
  document.getElementById("gems").textContent = p.gems;
  document.getElementById("lives").textContent = p.lives;

  const banner = document.getElementById("banner");
  if (p.lives <= 0) {
    banner.classList.add("show");
    banner.innerHTML = "❤️ Життя закінчились. Відновляться завтра — або натисни «Відновити життя (3 💎)».";
  } else { banner.classList.remove("show"); }

  const path = document.getElementById("path");
  path.innerHTML = "";
  const chests = chestsOf(p);
  window.TASKS.forEach((task, idx) => {
    const done = isDone(p, task.id);
    const prevDone = idx === 0 || isDone(p, window.TASKS[idx - 1].id);
    const open = (done || prevDone) && p.lives > 0;
    const gems = gemsOf(p, task.id);
    const chest = chests.find(c => c.i === idx);

    const step = document.createElement("div");
    step.className = "step";

    if (chest && !chest.opened) {
      const reachable = idx === 0 || prevDone;
      const b = document.createElement("button");
      b.className = "lvl chest" + (reachable ? "" : " locked");
      b.style.cssText = "background:none;border:0;font:inherit;padding:0";
      b.innerHTML = '<div class="dot">' + (reachable ? "🧰" : "📦") + '</div><div class="cap">' +
        (reachable ? "Скриня!" : "Скриня") + '</div>' +
        '<div class="st">' + (chest.kind === "life" ? "❤️" : "💎") + "</div>";
      if (reachable) {
        b.title = "Відкрий скриню — там подарунок";
        b.addEventListener("click", () => openChest(p, chest));
      } else {
        b.disabled = true;
        b.style.opacity = ".55";
        b.title = "Спочатку дійди до цієї скрині";
      }
      step.appendChild(b);
    } else {
      const a = document.createElement(done || open ? "a" : "div");
      a.className = "lvl " + (done ? "done" : open ? "open" : "locked");
      if (done || open) { a.href = "level.html?id=" + encodeURIComponent(task.id); }
      a.innerHTML =
        '<div class="dot">' + (done ? "✅" : open ? "▶️" : "🔒") + "</div>" +
        '<div class="cap">' + task.title + "</div>" +
        '<div class="st">' + (done ? "💎".repeat(Math.min(gems, 3)) : "") + "</div>";
      if (!open) { a.title = p.lives > 0 ? "Спочатку пройди попередню задачу" : "Немає життів"; }
      step.appendChild(a);
    }

    const ch = characterFor(idx);
    if (ch) {
      const s = document.createElement("span");
      s.className = "char " + (idx % 2 ? "left" : "right");
      s.textContent = ch;
      s.style.animationDelay = (idx % 5) * 0.35 + "s";
      step.appendChild(s);
    }

    path.appendChild(step);
  });
}

document.getElementById("heal").addEventListener("click", () => {
  const p = load();
  if (p.lives >= MAX_LIVES) { toast("Життя й так повні"); return; }
  if (p.gems < 3) { toast("Треба 3 кристали"); return; }
  p.gems -= 3; p.lives = MAX_LIVES; p.livesDate = todayStr();
  save(p); render(); toast("Життя відновлено ❤️");
});
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Скинути весь прогрес?")) { localStorage.removeItem(KEY); render(); toast("Прогрес скинуто"); }
});
document.getElementById("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(load(), null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "math-lessons-progress.json";
  a.click();
  toast("Файл прогресу збережено");
});
document.getElementById("import").addEventListener("click", () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("change", () => {
    const f = inp.files[0]; if (!f) { return; }
    const r = new FileReader();
    r.onload = () => {
      try { const d = JSON.parse(r.result); localStorage.setItem(KEY, JSON.stringify(d)); render(); toast("Прогрес завантажено"); }
      catch (e) { toast("Не вдалося прочитати файл"); }
    };
    r.readAsText(f);
  });
  inp.click();
});

render();
</script>
</body>
</html>
