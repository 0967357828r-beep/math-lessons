<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навчання — Тімолінго</title>
<link rel="stylesheet" href="game.css?v=20261120b">
<style>
/* Анімований супутник на карті уроків — повний зріст, прозорий WebP */
.timo-mascot { position: fixed; left: 272px; bottom: 6px; width: 120px; z-index: 6;
               pointer-events: none; filter: drop-shadow(0 8px 12px rgba(0,0,0,.45)); }
.timo-mascot .tm-figure { animation: tmIdle 2.8s ease-in-out infinite; transform-origin: 50% 100%; }
.timo-mascot .tm-figure img { display: block; width: 100%; height: auto; }
.timo-mascot .tm-shadow { width: 78px; height: 12px; margin: -3px auto 0; border-radius: 50%;
                          background: rgba(0,0,0,.38); filter: blur(4px);
                          animation: tmShadow 2.8s ease-in-out infinite; }
.timo-mascot .tm-bubble { position: absolute; left: 96%; top: 4px; max-width: 150px;
                          background: rgba(32,25,20,.96); border: 1px solid rgba(255,224,190,.28);
                          color: #fff1e2; border-radius: 12px; padding: 5px 9px;
                          font: 800 11px/1.25 inherit; white-space: nowrap;
                          box-shadow: 0 6px 16px rgba(0,0,0,.35); }
@keyframes tmIdle { 0%,100% { transform: translateY(0) rotate(-1deg); }
                    50% { transform: translateY(-7px) rotate(1deg); } }
@keyframes tmShadow { 0%,100% { transform: scaleX(1); opacity: .55; }
                      50% { transform: scaleX(.82); opacity: .3; } }
@media (max-width: 860px) {
  .timo-mascot { left: 8px; bottom: 2px; width: 84px; }
  .timo-mascot .tm-bubble { display: none; }
}
/* живі очі Тімка: оверлейні кадри кліпу/емоцій лягають поверх бази піксель-у-піксель */
.timo-mascot .tm-figure { position: relative; }
.timo-mascot .tm-lid { position: absolute; left: 0; top: 0; opacity: 0;
                       transition: opacity 45ms linear; pointer-events: none; }
.timo-mascot .tm-hit { position: absolute; left: 0; top: 0; width: 100%; height: 45%;
                       pointer-events: auto; cursor: pointer; z-index: 3; }
.timo-mascot .tm-figure.tm-hop { animation: tmHop .55s cubic-bezier(.3,1.6,.4,1); }
@keyframes tmHop { 0% { transform: translateY(0) rotate(0deg); }
                   35% { transform: translateY(-13px) rotate(2deg); }
                   70% { transform: translateY(-2px) rotate(-1deg); }
                   100% { transform: translateY(0) rotate(0deg); } }
.timo-mascot .tm-bubble.tm-pop { animation: tmPop .35s ease-out; }
@keyframes tmPop { 0% { transform: scale(.85); opacity: .4; }
                   100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .timo-mascot .tm-figure, .timo-mascot .tm-shadow { animation: none !important; }
  .timo-mascot .tm-lid { transition: none; }
  .timo-mascot .tm-bubble.tm-pop { animation: none; }
}
/* фінальна скарбниця в самому кінці дороги */
.finale-chest { position:relative; display:flex; flex-direction:column; align-items:center;
                margin: 18px 0 44px; padding-top: 30px; z-index:1; cursor:pointer; }
.finale-chest::before { content:""; position:absolute; top:0; left:50%; width:12px; height:46px;
                transform:translateX(-50%); border-radius:10px;
                background:repeating-linear-gradient(180deg, #cfcfcf 0 12px, #f4f4f4 12px 26px); }
.finale-chest .fc-glow { position:absolute; left:50%; top:55%; width:min(540px,92vw); height:min(430px,72vw);
                transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
                background:radial-gradient(ellipse, rgba(255,209,102,.38), rgba(255,209,102,.09) 45%, transparent 70%);
                animation: chestGlow 3.2s ease-in-out infinite; }
.finale-chest .fc-img { position:relative; width:clamp(260px, 36vw, 390px); height:auto;
                filter:drop-shadow(0 20px 26px rgba(0,0,0,.55)); animation: chestFloat 4s ease-in-out infinite; }
.finale-chest .fc-cap { margin-top: 8px; font-size: clamp(18px, 2.2vw, 24px); font-weight:900;
                color: var(--glow, #ffd166); text-shadow:0 2px 4px rgba(0,0,0,.65); letter-spacing:.5px; }
.finale-chest .fc-sub { margin-top:4px; font-size:12px; font-weight:800; color:var(--muted); text-align:center; }
.finale-chest.open .fc-glow { animation-duration: 2s; }
@keyframes chestFloat { 0%,100% { transform:translateY(0) rotate(-.4deg); }
                        50% { transform:translateY(-10px) rotate(.4deg); } }
@keyframes chestGlow { 0%,100% { opacity:.65; transform:translate(-50%,-50%) scale(.96); }
                       50% { opacity:1; transform:translate(-50%,-50%) scale(1.04); } }
@media (max-width: 860px) {
  .finale-chest .fc-img { width:min(280px, 72vw); }
}
@media (prefers-reduced-motion: reduce) {
  .finale-chest .fc-img, .finale-chest .fc-glow { animation:none; }
}
</style>
</head>
<body>
<div class="story-deco" aria-hidden="true"><span>🍄</span><span>🌿</span><span>✨</span></div>
<div class="league-bg" id="leagueBg" aria-hidden="true"></div>
<div class="fireflies" aria-hidden="true"></div>

<main class="main">
  <div class="wrap-wide">
    <div class="hud" id="hud"></div>
    <div class="with-rail">
      <section>
        <div class="daily-banner" id="dailyBanner"></div>
        <div class="path" id="path"></div>

      <aside class="rail">
        <div class="card" id="leagueCard"></div>

          <h3>Налаштування</h3>
          <div class="tools" style="margin-top:0">
            <button class="btn ghost" id="heal">❤️ Відновити життя (35 💎)</button>
            <button class="btn ghost" id="export">⬇️ Зберегти</button>
            <button class="btn ghost" id="import">⬆️ Завантажити</button>
            <button class="btn ghost" id="reset">♻️ Скинути</button>
          </div>
        </div>

</main>

<div class="timo-mascot" id="timoMascot" aria-hidden="true">
  <div class="tm-bubble" id="tmBubble">Привіт! Гайда вчитися! 🌿</div>
  <div class="tm-figure">
    <img src="art/mascot_tymko.webp?v=20261120b" alt="">
    <img class="tm-lid" id="tmBlink" src="art/mascot_tymko_blink.webp?v=20261120a" alt="">
    <img class="tm-lid" id="tmHappy" src="art/mascot_tymko_happy.webp?v=20261120a" alt="">
    <div class="tm-hit" id="tmHit" title="Тімко"></div>
  </div>
  <div class="tm-shadow"></div>
</div>

<div class="toast" id="toast"></div>
<script src="tasks.js?v=20261121b"></script>
<script src="avatars.js?v=20261120b"></script>
<script src="game.js?v=20261121b"></script>
<script>
(function () {
  var p = Game.load();
  Game.save(p);
  Game.renderSidebar("learn");
  document.getElementById("hud").innerHTML = Game.hudHTML();

  var TASKS = window.TASKS || [];
  var byId = {};
  TASKS.forEach(function (t) { byId[t.id] = t; });

  /* ---------- скрині: рівномірно в КОЖНОМУ розділі, самі добираються ----------
     v7: гра будує скрині від розділів, а не від випадкових індексів послідовності.
     Тому кожен новий розділ/партія уроків автоматично отримує свої скрині,
     а вже відкриті лишаються відкритими (нагороду не взяти двічі). */
  var CHEST_V = 7;
  function chestsOf(p) {
    /* сигнатура: додали уроки чи розділ — розкладка сама перерахується */
    var sig = Game.SEQ.length + ":" + Game.SECTIONS.length;
    if (p.chestsV === CHEST_V && p.chestsSig === sig && Array.isArray(p.chests)) { return p.chests; }

    var start = [], acc = 0;
    Game.SECTIONS.forEach(function (s, i) { start[i] = acc; acc += s.ids.length; });

    /* спадок: що гравець уже відкрив — не відроджуємо */
    var opened = {}, kindOf = {};
    (Array.isArray(p.chests) ? p.chests : []).forEach(function (c) {
      if (!c) { return; }
      var t = Game.SEQ[c.i];
      if (!t) { return; }
      kindOf[t.id] = c.kind;
      if (c.opened) { opened[t.id] = 1; }
    });

    var list = [], used = {};
    Game.SECTIONS.forEach(function (sec, si) {
      var n = sec.ids.length;
      if (!n) { return; }
      var target = Math.max(2, Math.round(n / 6));   /* мінімум 2 скрині на розділ */
      for (var k = 0; k < target; k++) {
        var pos = start[si] + Math.min(n - 1, Math.floor((k + 0.5) * n / target));
        /* не ховаємо пройдений урок, якщо в розділі ще є непройдені */
        if (Game.isDone(p, Game.SEQ[pos].id)) {
          for (var d = 1; d <= n; d++) {
            var q = start[si] + (pos - start[si] + d) % n;
            if (!used[q] && !Game.isDone(p, Game.SEQ[q].id)) { pos = q; break; }
          }
        }
        if (used[pos]) { continue; }
        used[pos] = 1;
        var id = Game.SEQ[pos].id;
        list.push({ i: pos, kind: kindOf[id] || (Math.random() < 0.55 ? "life" : "gems"), opened: !!opened[id] });
      }
    });

    /* біля поточного уроку — скриня завжди в межах трьох кроків */
    var firstOpen = -1;
    for (var o = 0; o < Game.SEQ.length; o++) {
      if (!Game.isDone(p, Game.SEQ[o].id)) { firstOpen = o; break; }
    }
    if (firstOpen >= 0 && !list.some(function (c) { return c.i >= firstOpen && c.i <= firstOpen + 3; })) {
      var at = Math.min(firstOpen + 2, Game.SEQ.length - 1);
      if (!used[at]) { list.push({ i: at, kind: "gems", opened: !!opened[Game.SEQ[at].id] }); }
    }

    p.chests = list.sort(function (a, b) { return a.i - b.i; });
    p.chestsV = CHEST_V;
    p.chestsSig = sig;
    return p.chests;
  }

  var CHARS = ["🐸", "🦎", "🐛", "🐌", "🦋", "🐞", "🐢", "🐝"];
  var CALM = ["Привіт! Гайда вчитися! 🌿", "Далі!", "Ще одна задача?", "Як справи?", "Гайда!", "Ти майже там!"];
  var HAPPY = ["Молодець!", "Ура!", "Супер!", "Ти зможеш!", "Круто!", "Так тримати!"];
  var CLICKY = ["Гей, це я — Тімко!", "Ще раз!", "Клац! 😄", "Гайда до уроку!", "Хі-хі!"];
  /* живий Тімко: кліпає очима у природному ритмі, радіє фразами, реагує на дотик */
  (function () {
    var bubble = document.getElementById("tmBubble");
    var blink = document.getElementById("tmBlink");
    var happy = document.getElementById("tmHappy");
    var hit = document.getElementById("tmHit");
    var fig = document.querySelector(".timo-mascot .tm-figure");
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!blink || !happy) { return; }

    function lid(el, on) { el.style.opacity = on ? 1 : 0; }

    function closeLids(after) {
      lid(blink, true);
      setTimeout(function () { lid(blink, false); if (after) { after(); } }, 130);
    }
    function doubleBlink() { closeLids(function () { setTimeout(closeLids, 150); }); }

    function scheduleBlink() {
      var wait = 2400 + Math.random() * 4400;   /* природний ритм: 2.4–6.8 с */
      setTimeout(function () {
        (Math.random() < 0.22 ? doubleBlink : closeLids)();
        scheduleBlink();
      }, wait);
    }

    function happyLids(ms) {
      if (reduce) { return; }
      lid(happy, true);
      setTimeout(function () { lid(happy, false); }, ms || 1500);
    }
    function hop() {
      if (!fig || reduce) { return; }
      fig.classList.remove("tm-hop");
      void fig.offsetWidth;
      fig.classList.add("tm-hop");
      setTimeout(function () { fig.classList.remove("tm-hop"); }, 600);
    }
    function say(text, isHappy) {
      if (!bubble) { return; }
      bubble.textContent = text;
      bubble.classList.remove("tm-pop");
      void bubble.offsetWidth;
      bubble.classList.add("tm-pop");
      if (isHappy) { happyLids(1700); hop(); }
    }
    function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

    function idleChat() {
      var isHappy = Math.random() < 0.35;
      say(pick(isHappy ? HAPPY : CALM), isHappy);
      setTimeout(idleChat, 7000 + Math.random() * 6000);
    }

    if (hit) {
      hit.addEventListener("click", function () {
        say(pick(CLICKY), true);
        if (!reduce) { setTimeout(doubleBlink, 1800); }
      });
    }

    if (reduce) { return; }   /* без анімації: спокійний Тімко з відкритими очима */
    scheduleBlink();
    setTimeout(idleChat, 6500);
  })();
  var charObserver = null;
  function observeChar(el) {
    if (!("IntersectionObserver" in window)) { el.classList.add("show"); return; }
    if (!charObserver) {
      charObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("show"); charObserver.unobserve(e.target); }
        });
      }, { threshold: 0.35 });
    }
    charObserver.observe(el);
  }

  function openChest(p, chest) {
    chest.opened = true;
    var msg;
    if (chest.kind === "life") {
      if (p.lives < Game.MAX_LIVES) { p.lives += 1; msg = "❤️ У скрині життя! +1"; }
      else { p.gems += 2; msg = "💎 Життя повні — натомість +2 кристали"; }
    } else {
      p.gems += 2; msg = "💎 У скрині +2 кристали";
    }
    Game.save(p);
    render();
    Game.toast(msg);
  }

  function questsCard() {
    var p = Game.load();
    var qs = Game.quests(p);
    var html = '<h3>Квести дня <a class="more" href="quests.html">усі</a></h3>';
    qs.forEach(function (q) {
      var pct = Math.min(100, Math.round(q.now / q.goal * 100));
      var done = q.now >= q.goal;
      var claimed = !!p.quests.claimed[q.id];
      html += '<div class="quest"><div class="qi">' + q.icon + '</div><div class="qm">' +
              '<div class="qt">' + q.title + '</div>' +
              '<div class="qbar"><div class="bar"><i style="width:' + pct + '%;background:#ffc800"></i></div>' +
              '<span>' + Math.min(q.now, q.goal) + ' / ' + q.goal + '</span></div></div>' +
              '<div class="qr">' + q.reward + '</div>' +
              (done ? (claimed ? '<span class="qr muted">✓</span>'
                               : '<button class="qbtn" data-claim="' + q.id + '">Забрати</button>')
                    : '') + '</div>';
    });
    document.getElementById("questCard").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll("[data-claim]"), function (b) {
      b.addEventListener("click", function () {
        var q = Game.claimQuest(b.getAttribute("data-claim"));
        if (q) { render(); Game.toast("Нагороду отримано: " + q.reward); }
      });
    });
  }

  function leagueCard() {
    var p = Game.load();
    var lg = Game.leagueOf(p);
    var lb = Game.weekLeaderboard(p);
    var el = document.getElementById("leagueCard");
    var bg = document.getElementById("leagueBg");
    if (bg) {
      bg.style.backgroundImage = 'linear-gradient(180deg, rgba(18,14,11,.55), rgba(18,14,11,.84)), url("' +
        lg.cur.city + '?v=20261120b")';
    }
    el.innerHTML = '<h3>' + lg.cur.name + ' ліга <a class="more" href="leaderboard.html">переглянути</a></h3>' +
      '<div class="league-row"><div class="league-badge"><img class="league-crest" src="' +
      lg.cur.crest + '?v=20261120b" alt=""></div><div><b>Ви на ' + lb.rank + ' місці</b>' +
      '<div class="muted">' + (lb.demote ? "Є ризик повернутися в нижчу лігу!"
                                          : lb.promote ? "Ви в зоні підвищення!" : "Тримайте темп!") + '</div></div></div>' +
      '<div style="margin-top:12px" class="bar"><i style="width:' + Math.round(lg.pct * 100) + '%;background:' +
      lg.cur.color + '"></i></div>' +
      '<div class="muted" style="font-size:11px;font-weight:800;margin-top:6px">' +
      (lg.next ? (lg.next.need - p.xp) + ' XP до ліги «' + lg.next.name + '»' : 'Найвища ліга! 🎉') + '</div>';
  }

  function renderDaily(p) {
    var rec = Game.taskOfDay(p);
    var task = Game.taskById(rec.id);
    var chest = Game.dailyChestState(p);
    var banner = document.getElementById("dailyBanner");
    if (banner) {
      if (!rec.done && task) {
        banner.innerHTML = '<span><img src="art/icon_star.webp?v=20261120b" class="ico sm" alt=""> <b>Задача дня:</b> ' + Game.esc(task.title) + '</span>' +
          '<a class="db-go" href="level.html?id=' + encodeURIComponent(rec.id) + '">Грати · +5 💎</a>';
        banner.style.display = "flex";
      } else {
        banner.style.display = "none";
      }
    }
    var card = document.getElementById("dailyCard");
    if (card) {
      card.innerHTML = '<h3>Бонуси дня</h3>' +
        '<div class="quest"><div class="qi"><img src="art/icon_chest.webp?v=20261120b" class="ico" alt=""></div><div class="qm">' +
        '<div class="qt">Скриня дня</div><div class="muted" style="font-size:11px;font-weight:700">' +
        (chest.available ? "Одна на добу — кристали або життя" : "Вже відкрита сьогодні") + '</div></div>' +
        (chest.available ? '<button class="qbtn" id="dailyChest">Відкрити</button>'
                         : '<span class="qr muted">✓</span>') + '</div>' +
        '<div class="quest"><div class="qi"><img src="art/icon_star.webp?v=20261120b" class="ico" alt=""></div><div class="qm">' +
        '<div class="qt">Задача дня</div><div class="muted" style="font-size:11px;font-weight:700">' +
        (rec.done ? "Виконано! +5 💎" : (task ? Game.esc(task.title) : "")) + '</div></div>' +
        (rec.done ? '<span class="qr muted">✓</span>' : '<span class="qr">+5 💎</span>') + '</div>';
      var b = document.getElementById("dailyChest");
      if (b) {
        b.addEventListener("click", function () {
          var r = Game.openDailyChest();
          if (r) {
            render();
            Game.toast(r.type === "life" ? ("❤️ +" + r.n + " життя") : ("💎 +" + r.n + " кристали"));
          }
        });
      }
    }
  }

  function render() {
    var p = Game.load();
    var chests = chestsOf(p);
    Game.save(p);
    var path = document.getElementById("path");
    path.innerHTML = "";
    var seqIdx = -1;

    Game.SECTIONS.forEach(function (sec, si) {
      var prog = Game.sectionProgress(p, sec);
      var head = document.createElement("div");
      head.className = "sec-head" + (sec.color === "#ffc800" ? " gold" : "");
      head.style.setProperty("--sec", sec.color);
      head.style.setProperty("--sec-shade", Game.SECTION_SHADE[sec.id] || "#46a302");
      head.innerHTML = '<div class="sh-emoji">' + sec.emoji + '</div>' +
        '<div><div class="sh-kicker">Частина 1 · Розділ ' + (si + 1) + '</div>' +
        '<h2>' + sec.title + '</h2></div>' +
        '<div class="sh-bar"><div>' + prog.done + ' / ' + prog.total + '</div>' +
        '<div class="bar"><i style="width:' + Math.round(prog.pct * 100) + '%"></i></div></div>';
      path.appendChild(head);

      var sub = document.createElement("div");
      sub.className = "sec-sub";
      sub.textContent = sec.sub;
      path.appendChild(sub);

      var steps = document.createElement("div");
      steps.className = "sec-path";
      path.appendChild(steps);

      sec.ids.forEach(function (id, li) {
        seqIdx++;
        var task = byId[id];
        if (!task) { return; }
        var done = Game.isDone(p, id);
        var open = (seqIdx === 0 || Game.isDone(p, Game.SEQ[seqIdx - 1].id)) && p.lives > 0;
        var perfect = Game.isPerfect(p, id);
        var repeated = Game.isRepeat(p, id);
        var chest = chests.filter(function (c) { return c.i === seqIdx; })[0];

        var step = document.createElement("div");
        step.className = "step o" + (li % 4);

        if (chest && !chest.opened) {
          var reachable = seqIdx === 0 || Game.isDone(p, Game.SEQ[seqIdx - 1].id);
          var cb = document.createElement("button");
          cb.className = "lvl chest" + (reachable ? "" : " locked");
          cb.innerHTML = '<div class="dot"><img src="art/icon_chest.webp?v=20261120b" class="ico" alt=""></div>' +
            '<div class="cap">' + (reachable ? "Скриня!" : "Скриня") + '</div>' +
            '<div class="st">' + (chest.kind === "life" ? "❤️" : "💎") + '</div>';
          if (reachable) {
            cb.addEventListener("click", function () { openChest(p, chest); });
          } else { cb.disabled = true; }
          step.appendChild(cb);
        } else {
          var node = document.createElement(done || open ? "a" : "div");
          node.className = "lvl " + (done ? "done" : open ? "open" : "locked") + (perfect ? " perfect" : "") + (repeated ? " repeat" : "");
          if (done || open) { node.href = "level.html?id=" + encodeURIComponent(id); }
          node.innerHTML = '<div class="dot">' +
            (done ? (perfect ? '<img src="art/icon_gem.webp?v=20261120b" class="ico" alt="">' : '<img src="art/icon_check.webp?v=20261120b" class="ico" alt="">')
                  : open ? "▶️" : '<img src="art/icon_lock.webp?v=20261120b" class="ico" alt="">') + '</div>' +
            '<div class="cap">' + (repeated ? "🔁 " : "") + Game.esc(task.title) + '</div>' +
            '<div class="st">' + (repeated ? "на завтра" : "") + '</div>';
          step.appendChild(node);
        }

        steps.appendChild(step);
      });

      /* кубок розділу — окремий вузол у кінці стежки */
      var tp = Game.sectionProgress(p, sec);
      var tdone = tp.done === tp.total;
      var tstep = document.createElement("div");
      tstep.className = "step trophy-step o" + (sec.ids.length % 4);
      var tnode = document.createElement(tdone ? "button" : "div");
      tnode.className = "lvl trophy" + (tdone ? " done" : " locked");
      tnode.innerHTML = '<div class="dot"><svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><path d="M20 7h24v11a12 12 0 0 1-24 0z" fill="#f7b500"/><path d="M20 11h-7a9 9 0 0 0 9 9" fill="none" stroke="#e09b00" stroke-width="4" stroke-linecap="round"/><path d="M44 11h7a9 9 0 0 1-9 9" fill="none" stroke="#e09b00" stroke-width="4" stroke-linecap="round"/><rect x="29" y="30" width="6" height="9" rx="1" fill="#e09b00"/><rect x="21" y="39" width="22" height="6" rx="2" fill="#d18f00"/><rect x="16" y="45" width="32" height="9" rx="3" fill="#b37400"/><path d="M27 12h4v10a4 4 0 0 1-4-4z" fill="#ffd54f" opacity=".85"/></svg></div><div class="cap">Кубок розділу</div>' +
        '<div class="st">' + (tdone ? "+15 💎" : tp.done + " / " + tp.total) + '</div>';
      if (tdone) {
        tnode.addEventListener("click", function () {
          Game.toast("Кубок розділу «" + sec.title + "» вже в колекції 🏆");
        });
      }
      tstep.appendChild(tnode);
      steps.appendChild(tstep);
    });

    /* фінальна скарбниця — у самому кінці дороги, після всіх розділів */
    var doneCount = 0;
    Game.SEQ.forEach(function (t) { if (Game.isDone(p, t.id)) { doneCount++; } });
    var doneAll = doneCount === Game.SEQ.length;
    var finale = document.createElement("div");
    finale.className = "finale-chest" + (doneAll ? " open" : "");
    finale.innerHTML = '<div class="fc-glow"></div>' +
      '<img class="fc-img" src="art/final_chest.webp?v=20261120b" alt="Скарбниця курсу">' +
      '<div class="fc-cap">Скарбниця курсу</div>' +
      '<div class="fc-sub">' + (doneAll ? "Ти дійшов до кінця! Натисни, щоб відкрити"
                                         : "Пройдено " + doneCount + " із " + Game.SEQ.length + " уроків") + '</div>';
    finale.addEventListener("click", function () {
      if (doneAll) {
        finale.classList.add("open");
        Game.toast("Скарбниця курсу відкрита! Ти пройшов усі " + Game.SEQ.length + " уроків 🏆");
      } else {
        Game.toast("Скарбниця відкриється, коли пройдеш усі уроки. Залишилось " +
                   (Game.SEQ.length - doneCount) + ".");
      }
    });
    path.appendChild(finale);

    renderDaily(p);
    leagueCard();
    questsCard();
    document.getElementById("hud").innerHTML = Game.hudHTML();
  }

  document.getElementById("heal").addEventListener("click", function () {
    var p = Game.load();
    if (p.lives >= Game.MAX_LIVES) { Game.toast("Життя й так повні"); return; }
    if (p.gems < 35) { Game.toast("Треба 35 кристалів"); return; }
    p.gems -= 35; p.lives = Game.MAX_LIVES; p.livesDate = Game.todayStr();
    Game.save(p); render(); Game.toast("Життя відновлено ❤️");
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (confirm("Скинути весь прогрес?")) { localStorage.removeItem(Game.KEY); render(); }
  });
  document.getElementById("export").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(Game.load(), null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "math-lessons-progress.json"; a.click();
    Game.toast("Файл прогресу збережено");
  });
  document.getElementById("import").addEventListener("click", function () {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.addEventListener("change", function () {
      var f = inp.files[0]; if (!f) { return; }
      var r = new FileReader();
      r.onload = function () {
        try {
          var clean = Game.sanitize(JSON.parse(r.result));
          if (!clean) { throw new Error("bad profile"); }
          localStorage.setItem(Game.KEY, JSON.stringify(clean));
          render(); Game.toast("Прогрес завантажено");
        } catch (e) { Game.toast("Не вдалося прочитати файл"); }
      };
      r.readAsText(f);
    });
    inp.click();
  });

  render();
  var notice = Game.load().leagueDropNotice;
  if (notice) {
    var p2 = Game.load();
    delete p2.leagueDropNotice;
    Game.save(p2);
    setTimeout(function () {
      Game.toast(notice.from !== notice.to
        ? ("😮 " + notice.days + " днів без занять — ліга знижена до «" + notice.to + "», −" + notice.lost + " XP")
        : ("😮 " + notice.days + " днів без занять — −" + notice.lost + " XP"));
    }, 600);
  }
})();
</script>
<style>
/* поличка кубків пройдених задач */
.shelf-card { position:relative; z-index:1; background:rgba(38,30,25,.86); border:1px solid rgba(255,209,102,.18);
              border-radius:18px; padding:12px 16px 16px; margin:6px 0 18px; box-shadow:0 10px 26px rgba(0,0,0,.35); }
.shelf-head { display:flex; align-items:center; justify-content:space-between; color:#fff2e0;
              font-weight:900; font-size:13px; letter-spacing:.4px; margin-bottom:6px; }
.shelf-head b { color:#ffd166; font-size:14px; }
.shelf-row { display:flex; align-items:flex-end; gap:0; flex-wrap:nowrap; overflow:hidden;
             padding:12px 14px 0; border-radius:8px 8px 3px 3px;
             background:linear-gradient(180deg,#8a5a33,#6b4423 70%,#5a381c);
             border-bottom:6px solid #4a2e17;
             box-shadow:inset 0 2px 0 rgba(255,255,255,.14), 0 7px 12px rgba(0,0,0,.4);
             min-height:56px; margin-top:6px; }
.trophy-item { flex:0 0 auto; margin-right:-13px; display:flex; align-items:flex-end; position:relative; }
.trophy-item:hover { transform:translateY(-2px); }
.shelf-row .trophy-item:last-of-type { margin-right:0; }
.shelf-row svg { display:block; flex:0 0 auto; filter:drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
.shelf-empty { color:#cbb898; font-weight:700; font-size:12px; padding:10px 2px 6px; }
.shelf-plus { align-self:center; margin-left:16px; z-index:9; color:#ffe6b8; background:rgba(0,0,0,.4); border-radius:999px;
              padding:3px 10px; font-weight:900; font-size:12px; }
@media (max-width:640px){ .shelf-row{gap:0;padding:8px 10px 0;min-height:48px} .trophy-item{margin-right:-11px} .shelf-head{font-size:12px} }
</style>
<script>
(function () {
  var hud = document.getElementById("hud");
  if (!hud || !window.Game) { return; }
  var p = Game.load();
  var done = [];
  Game.SEQ.forEach(function (e) { if (Game.isDone(p, e.id)) { done.push(e.id); } });

  var GOLD = ["#ffd166", "#f0a63c", "#e9c46a", "#c98a4b"];
  /* 8 форм кубка: 0 широкий, 1 вузький високий, 2 присадкуваний, 3 келих, 4 кухоль,
     5 чаша із зіркою, 6 флейта, 7 орнаментний */
  var SHAPES = [
    '<path d="M4 4h16v3a8 6.5 0 0 1-16 0z"/><path d="M10.6 14h2.8v4h-2.8z"/><path d="M7.5 18h9v2.2h-9z"/><path d="M4 5.2C1.8 5.2 1.8 9.6 5.4 9.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M20 5.2c2.2 0 2.2 4.4-1.4 4.6" fill="none" stroke="currentColor" stroke-width="1.5"/>',
    '<path d="M8 3h8v6a4 4 0 0 1-8 0z"/><path d="M11 13.5h2v4.5h-2z"/><path d="M8.5 18h7v2h-7z"/>',
    '<path d="M3 5h18v2a9 6 0 0 1-18 0z"/><path d="M10.7 12.5h2.6v5h-2.6z"/><path d="M8 17.5h8v2.3H8z"/>',
    '<path d="M7 3h10v5a5 5 0 0 1-10 0z"/><path d="M11.1 12.5h1.8v5.5h-1.8z"/><ellipse cx="12" cy="19.5" rx="4.6" ry="1.7"/>',
    '<path d="M5 4h11v11H5z"/><path d="M16 6.5h1.4a2.6 2.6 0 0 1 0 5.2H16" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 17h11v2H5z"/>',
    '<path d="M7 4h10v4.5a5 4.5 0 0 1-10 0z"/><path d="M11 12h2v5h-2z"/><path d="M8 17h8v2H8z"/><path d="M12 5.4l.55 1.12 1.23.18-.89.87.21 1.23-1.1-.58-1.1.58.21-1.23-.89-.87 1.23-.18z"/>',
    '<path d="M10 2h4v10a2 2 0 0 1-4 0z"/><path d="M11.2 14h1.6v4h-1.6z"/><path d="M8.8 18h6.4v2H8.8z"/>',
    '<circle cx="12" cy="3.4" r="1.3"/><path d="M6.5 5h11v4a5.5 4.6 0 0 1-11 0z"/><path d="M11 12.5h2v5h-2z"/><path d="M7 17.5h10v2.3H7z"/><path d="M6.5 6C4.4 6 4.4 10.2 7.8 10.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M17.5 6c2.1 0 2.1 4.2-1.3 4.4" fill="none" stroke="currentColor" stroke-width="1.5"/>'
  ];
  function hash(s) { var h = 7; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 1000003; } return h; }
  var byId = {};
  (window.TASKS || []).forEach(function (t) { byId[t.id] = t; });
  function trophy(id) {
    var h = hash(id);
    var shape = h % 8;
    var sizes = [16, 20, 25, 30, 34, 39];
    var size = sizes[(h >> 3) % 6];
    var col = GOLD[(h >> 6) % 4];
    var name = byId[id] ? byId[id].title : "";
    return '<span class="trophy-item"' + (name ? ' title="' + name + '"' : "") + '><svg width="' + size +
           '" height="' + size + '" viewBox="0 0 24 22" fill="' + col + '" aria-hidden="true">' +
           SHAPES[shape] + "</svg></span>";
  }

  var card = document.createElement("div");
  card.className = "shelf-card";
  var MAXSHOW = 40;
  var html = '<div class="shelf-head"><span>🏆 Кубки пройдених задач</span><b>' + done.length + " / " + Game.SEQ.length + "</b></div>";
  if (!done.length) {
    html += '<div class="shelf-empty">Поличка чекає перший кубок — пройди будь-який урок!</div>';
  } else {
    var shown = Math.min(done.length, MAXSHOW);
    html += '<div class="shelf-row">';
    for (var i = 0; i < shown; i++) { html += trophy(done[i]); }
    if (done.length > shown) { html += '<span class="shelf-plus">+' + (done.length - shown) + " ще</span>"; }
    html += "</div>";
  }
  card.innerHTML = html;
  hud.insertAdjacentElement("afterend", card);
})();
</script>
</body>
