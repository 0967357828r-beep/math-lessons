<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навчання — Тімолінго</title>
<link rel="stylesheet" href="game.css?v=20261117p">
</head>
<body>
<div class="story-deco" aria-hidden="true"><span>🍄</span><span>🌿</span><span>✨</span></div>
<aside class="side" id="side"></aside>

<main class="main">
  <div class="wrap-wide">
    <div class="hud" id="hud"></div>
    <div class="with-rail">
      <section>
        <div class="daily-banner" id="dailyBanner"></div>
        <div class="path" id="path"></div>
      </section>

      <aside class="rail">
        <div class="card" id="leagueCard"></div>
        <div class="card" id="questCard"></div>
        <div class="card" id="dailyCard"></div>
        <div class="card">
          <h3>Налаштування</h3>
          <div class="tools" style="margin-top:0">
            <button class="btn ghost" id="heal">❤️ Відновити життя (35 💎)</button>
            <button class="btn ghost" id="export">⬇️ Зберегти</button>
            <button class="btn ghost" id="import">⬆️ Завантажити</button>
            <button class="btn ghost" id="reset">♻️ Скинути</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="tasks.js?v=20261117p"></script>
<script src="avatars.js?v=20261117p"></script>
<script src="game.js?v=20261117p"></script>
<script>
(function () {
  var p = Game.load();
  Game.save(p);
  Game.renderSidebar("learn");
  document.getElementById("hud").innerHTML = Game.hudHTML();

  var TASKS = window.TASKS || [];
  var byId = {};
  TASKS.forEach(function (t) { byId[t.id] = t; });

  function chestsOf(p) {
    if (p.chestsV === 5 && Array.isArray(p.chests)) { return p.chests; }
    var n = Game.SEQ.length, list = [], used = {}, guard = 0, count = Math.max(4, Math.round(n / 6));
    while (list.length < count && guard < 900) {
      guard++;
      var i = 2 + Math.floor(Math.random() * Math.max(1, n - 3));
      if (used[i]) { continue; }
      if (Game.isDone(p, Game.SEQ[i].id)) { continue; }
      used[i] = 1;
      list.push({ i: i, kind: Math.random() < 0.55 ? "life" : "gems", opened: false });
    }
    p.chests = list.sort(function (a, b) { return a.i - b.i; });
    var firstOpen = -1;
    for (var k = 0; k < Game.SEQ.length; k++) {
      if (!Game.isDone(p, Game.SEQ[k].id)) { firstOpen = k; break; }
    }
    if (firstOpen >= 0 && !p.chests.some(function (c) { return c.i >= firstOpen && c.i <= firstOpen + 4; })) {
      p.chests.push({ i: Math.min(firstOpen + 2, n - 1), kind: "gems", opened: false });
      p.chests.sort(function (a, b) { return a.i - b.i; });
    }
    p.chestsV = 5;
    return p.chests;
  }

  var CHARS = ["🐸", "🦎", "🐛", "🐌", "🦋", "🐞", "🐢", "🐝"];
  var PHRASES = ["Привіт!", "Молодець!", "Далі!", "Ура!", "Ти зможеш!", "Ще одна!", "Супер!", "Гайда!"];
  var charObserver = null;
  function observeChar(el) {
    if (!("IntersectionObserver" in window)) { el.classList.add("show"); return; }
    if (!charObserver) {
      charObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("show"); charObserver.unobserve(e.target); }
        });
      }, { threshold: 0.35 });
    }
    charObserver.observe(el);
  }

  function openChest(p, chest) {
    chest.opened = true;
    var msg;
    if (chest.kind === "life") {
      if (p.lives < Game.MAX_LIVES) { p.lives += 1; msg = "❤️ У скрині життя! +1"; }
      else { p.gems += 2; msg = "💎 Життя повні — натомість +2 кристали"; }
    } else {
      p.gems += 2; msg = "💎 У скрині +2 кристали";
    }
    Game.save(p);
    render();
    Game.toast(msg);
  }

  function questsCard() {
    var p = Game.load();
    var qs = Game.quests(p);
    var html = '<h3>Квести дня <a class="more" href="quests.html">усі</a></h3>';
    qs.forEach(function (q) {
      var pct = Math.min(100, Math.round(q.now / q.goal * 100));
      var done = q.now >= q.goal;
      var claimed = !!p.quests.claimed[q.id];
      html += '<div class="quest"><div class="qi">' + q.icon + '</div><div class="qm">' +
              '<div class="qt">' + q.title + '</div>' +
              '<div class="qbar"><div class="bar"><i style="width:' + pct + '%;background:#ffc800"></i></div>' +
              '<span>' + Math.min(q.now, q.goal) + ' / ' + q.goal + '</span></div></div>' +
              '<div class="qr">' + q.reward + '</div>' +
              (done ? (claimed ? '<span class="qr muted">✓</span>'
                               : '<button class="qbtn" data-claim="' + q.id + '">Забрати</button>')
                    : '') + '</div>';
    });
    document.getElementById("questCard").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll("[data-claim]"), function (b) {
      b.addEventListener("click", function () {
        var q = Game.claimQuest(b.getAttribute("data-claim"));
        if (q) { render(); Game.toast("Нагороду отримано: " + q.reward); }
      });
    });
  }

  function leagueCard() {
    var p = Game.load();
    var lg = Game.leagueOf(p);
    var lb = Game.weekLeaderboard(p);
    var el = document.getElementById("leagueCard");
    el.innerHTML = '<h3>' + lg.cur.name + ' ліга <a class="more" href="leaderboard.html">переглянути</a></h3>' +
      '<div class="league-row"><div class="league-badge" style="background:' + lg.cur.color + '22">' +
      lg.cur.emoji + '</div><div><b>Ви на ' + lb.rank + ' місці</b>' +
      '<div class="muted">' + (lb.demote ? "Є ризик повернутися в нижчу лігу!"
                                          : lb.promote ? "Ви в зоні підвищення!" : "Тримайте темп!") + '</div></div></div>' +
      '<div style="margin-top:12px" class="bar"><i style="width:' + Math.round(lg.pct * 100) + '%;background:' +
      lg.cur.color + '"></i></div>' +
      '<div class="muted" style="font-size:11px;font-weight:800;margin-top:6px">' +
      (lg.next ? (lg.next.need - p.xp) + ' XP до ліги «' + lg.next.name + '»' : 'Найвища ліга! 🎉') + '</div>';
  }

  function renderDaily(p) {
    var rec = Game.taskOfDay(p);
    var task = Game.taskById(rec.id);
    var chest = Game.dailyChestState(p);
    var banner = document.getElementById("dailyBanner");
    if (banner) {
      if (!rec.done && task) {
        banner.innerHTML = '<span>🎯 <b>Задача дня:</b> ' + Game.esc(task.title) + '</span>' +
          '<a class="db-go" href="level.html?id=' + encodeURIComponent(rec.id) + '">Грати · +5 💎</a>';
        banner.style.display = "flex";
      } else {
        banner.style.display = "none";
      }
    }
    var card = document.getElementById("dailyCard");
    if (card) {
      card.innerHTML = '<h3>Бонуси дня</h3>' +
        '<div class="quest"><div class="qi">🎁</div><div class="qm">' +
        '<div class="qt">Скриня дня</div><div class="muted" style="font-size:11px;font-weight:700">' +
        (chest.available ? "Одна на добу — кристали або життя" : "Вже відкрита сьогодні") + '</div></div>' +
        (chest.available ? '<button class="qbtn" id="dailyChest">Відкрити</button>'
                         : '<span class="qr muted">✓</span>') + '</div>' +
        '<div class="quest"><div class="qi">🎯</div><div class="qm">' +
        '<div class="qt">Задача дня</div><div class="muted" style="font-size:11px;font-weight:700">' +
        (rec.done ? "Виконано! +5 💎" : (task ? Game.esc(task.title) : "")) + '</div></div>' +
        (rec.done ? '<span class="qr muted">✓</span>' : '<span class="qr">+5 💎</span>') + '</div>';
      var b = document.getElementById("dailyChest");
      if (b) {
        b.addEventListener("click", function () {
          var r = Game.openDailyChest();
          if (r) {
            render();
            Game.toast(r.type === "life" ? ("❤️ +" + r.n + " життя") : ("💎 +" + r.n + " кристали"));
          }
        });
      }
    }
  }

  function render() {
    var p = Game.load();
    var chests = chestsOf(p);
    Game.save(p);
    var path = document.getElementById("path");
    path.innerHTML = "";
    var seqIdx = -1;

    Game.SECTIONS.forEach(function (sec, si) {
      var prog = Game.sectionProgress(p, sec);
      var head = document.createElement("div");
      head.className = "sec-head" + (sec.color === "#ffc800" ? " gold" : "");
      head.style.setProperty("--sec", sec.color);
      head.style.setProperty("--sec-shade", Game.SECTION_SHADE[sec.id] || "#46a302");
      head.innerHTML = '<div class="sh-emoji">' + sec.emoji + '</div>' +
        '<div><div class="sh-kicker">Частина 1 · Розділ ' + (si + 1) + '</div>' +
        '<h2>' + sec.title + '</h2></div>' +
        '<div class="sh-bar"><div>' + prog.done + ' / ' + prog.total + '</div>' +
        '<div class="bar"><i style="width:' + Math.round(prog.pct * 100) + '%"></i></div></div>';
      path.appendChild(head);

      var sub = document.createElement("div");
      sub.className = "sec-sub";
      sub.textContent = sec.sub;
      path.appendChild(sub);

      var steps = document.createElement("div");
      steps.className = "sec-path";
      path.appendChild(steps);

      sec.ids.forEach(function (id, li) {
        seqIdx++;
        var task = byId[id];
        if (!task) { return; }
        var done = Game.isDone(p, id);
        var open = (seqIdx === 0 || Game.isDone(p, Game.SEQ[seqIdx - 1].id)) && p.lives > 0;
        var perfect = Game.isPerfect(p, id);
        var repeated = Game.isRepeat(p, id);
        var chest = chests.filter(function (c) { return c.i === seqIdx; })[0];

        var step = document.createElement("div");
        step.className = "step o" + (li % 4);

        if (chest && !chest.opened) {
          var reachable = seqIdx === 0 || Game.isDone(p, Game.SEQ[seqIdx - 1].id);
          var cb = document.createElement("button");
          cb.className = "lvl chest" + (reachable ? "" : " locked");
          cb.innerHTML = '<div class="dot"><img src="art/icon_chest.png" class="ico" alt=""></div>' +
            '<div class="cap">' + (reachable ? "Скриня!" : "Скриня") + '</div>' +
            '<div class="st">' + (chest.kind === "life" ? "❤️" : "💎") + '</div>';
          if (reachable) {
            cb.addEventListener("click", function () { openChest(p, chest); });
          } else { cb.disabled = true; }
          step.appendChild(cb);
        } else {
          var node = document.createElement(done || open ? "a" : "div");
          node.className = "lvl " + (done ? "done" : open ? "open" : "locked") + (perfect ? " perfect" : "") + (repeated ? " repeat" : "");
          if (done || open) { node.href = "level.html?id=" + encodeURIComponent(id); }
          node.innerHTML = '<div class="dot">' +
            (done ? (perfect ? '<img src="art/icon_gem.png" class="ico" alt="">' : "✅")
                  : open ? "▶️" : '<img src="art/icon_lock.png" class="ico" alt="">') + '</div>' +
            '<div class="cap">' + (repeated ? "🔁 " : "") + Game.esc(task.title) + '</div>' +
            '<div class="st">' + (repeated ? "на завтра" : "") + '</div>';
          step.appendChild(node);
        }

        steps.appendChild(step);
      });

      /* кубок розділу — окремий вузол у кінці стежки */
      var tp = Game.sectionProgress(p, sec);
      var tdone = tp.done === tp.total;
      var tstep = document.createElement("div");
      tstep.className = "step trophy-step o" + (sec.ids.length % 4);
      var tnode = document.createElement(tdone ? "button" : "div");
      tnode.className = "lvl trophy" + (tdone ? " done" : " locked");
      tnode.innerHTML = '<div class="dot"><svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><path d="M20 7h24v11a12 12 0 0 1-24 0z" fill="#f7b500"/><path d="M20 11h-7a9 9 0 0 0 9 9" fill="none" stroke="#e09b00" stroke-width="4" stroke-linecap="round"/><path d="M44 11h7a9 9 0 0 1-9 9" fill="none" stroke="#e09b00" stroke-width="4" stroke-linecap="round"/><rect x="29" y="30" width="6" height="9" rx="1" fill="#e09b00"/><rect x="21" y="39" width="22" height="6" rx="2" fill="#d18f00"/><rect x="16" y="45" width="32" height="9" rx="3" fill="#b37400"/><path d="M27 12h4v10a4 4 0 0 1-4-4z" fill="#ffd54f" opacity=".85"/></svg></div><div class="cap">Кубок розділу</div>' +
        '<div class="st">' + (tdone ? "+15 💎" : tp.done + " / " + tp.total) + '</div>';
      if (tdone) {
        tnode.addEventListener("click", function () {
          Game.toast("Кубок розділу «" + sec.title + "» вже в колекції 🏆");
        });
      }
      tstep.appendChild(tnode);
      steps.appendChild(tstep);
    });

    renderDaily(p);
    leagueCard();
    questsCard();
    document.getElementById("hud").innerHTML = Game.hudHTML();
  }

  document.getElementById("heal").addEventListener("click", function () {
    var p = Game.load();
    if (p.lives >= Game.MAX_LIVES) { Game.toast("Життя й так повні"); return; }
    if (p.gems < 35) { Game.toast("Треба 35 кристалів"); return; }
    p.gems -= 35; p.lives = Game.MAX_LIVES; p.livesDate = Game.todayStr();
    Game.save(p); render(); Game.toast("Життя відновлено ❤️");
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (confirm("Скинути весь прогрес?")) { localStorage.removeItem(Game.KEY); render(); }
  });
  document.getElementById("export").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(Game.load(), null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "math-lessons-progress.json"; a.click();
    Game.toast("Файл прогресу збережено");
  });
  document.getElementById("import").addEventListener("click", function () {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.addEventListener("change", function () {
      var f = inp.files[0]; if (!f) { return; }
      var r = new FileReader();
      r.onload = function () {
        try {
          var clean = Game.sanitize(JSON.parse(r.result));
          if (!clean) { throw new Error("bad profile"); }
          localStorage.setItem(Game.KEY, JSON.stringify(clean));
          render(); Game.toast("Прогрес завантажено");
        } catch (e) { Game.toast("Не вдалося прочитати файл"); }
      };
      r.readAsText(f);
    });
    inp.click();
  });

  render();
  var notice = Game.load().leagueDropNotice;
  if (notice) {
    var p2 = Game.load();
    delete p2.leagueDropNotice;
    Game.save(p2);
    setTimeout(function () {
      Game.toast(notice.from !== notice.to
        ? ("😮 " + notice.days + " днів без занять — ліга знижена до «" + notice.to + "», −" + notice.lost + " XP")
        : ("😮 " + notice.days + " днів без занять — −" + notice.lost + " XP"));
    }, 600);
  }
})();
</script>
</body>
</html>
