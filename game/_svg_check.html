<!DOCTYPE html><html><head><meta charset="utf-8"><title>pending</title></head><body>
<iframe id="f" src="art/mascot_olm.svg" style="width:240px;height:360px;border:0"></iframe>
<script>
var f = document.getElementById('f'), lidMax = 0, mouthMax = 0, smileMin = 1, ticks = 0;
f.addEventListener('load', function () {
  var d = f.contentDocument, w = f.contentWindow;
  var lid = d.querySelector('.lid'), mouth = d.querySelector('.mouth-open'), smile = d.querySelector('.smile');
  var iv = setInterval(function () {
    function sy(el) {
      var t = w.getComputedStyle(el).transform;
      if (t === 'none') return 1;
      var m = t.match(/matrix\(([^)]+)\)/);
      return m ? parseFloat(m[1].split(',')[3]) : 1;
    }
    lidMax = Math.max(lidMax, sy(lid));
    mouthMax = Math.max(mouthMax, sy(mouth));
    smileMin = Math.min(smileMin, parseFloat(w.getComputedStyle(smile).opacity));
    ticks++;
    if (ticks > 100) {
      clearInterval(iv);
      document.title = JSON.stringify({ lidMax: lidMax, mouthMax: mouthMax, smileMin: smileMin, ticks: ticks,
      animLid: w.getComputedStyle(lid).animationName, animMouth: w.getComputedStyle(mouth).animationName });
    }
  }, 100);
});
</script></body></html>
