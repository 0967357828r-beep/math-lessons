<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренування — Тімолінго</title>
<link rel="stylesheet" href="game.css?v=20261120b">
<style>
  .modes { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 18px; }
  .mode { border: 2px solid #e5e5e5; border-bottom-width: 4px; background: #fff; border-radius: 14px;
          padding: 9px 14px; font: 800 13px inherit; color: #777; cursor: pointer; }
  .mode.on { border-color: #1cb0f6; background: #ddf4ff; color: #0a7bb8; }
  .train-card { border: 2px solid #e5e5e5; border-radius: 18px; padding: 20px; }
  .qbig { font-size: clamp(30px, 6vw, 44px); font-weight: 900; text-align: center; letter-spacing: 1px;
          margin: 14px 0 8px; color: #3c3c3c; }
  .qbig .eq { color: #afafaf; margin-left: 8px; }
  .answer { min-height: 62px; border: 3px solid #e5e5e5; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; font-size: 34px; font-weight: 900;
            color: #1cb0f6; margin: 10px 0 16px; letter-spacing: 2px; background: #fafafa; }
  .answer.ok { border-color: #58cc02; color: #3f8000; background: #f0fff0; }
  .answer.bad { border-color: #ff4b4b; color: #ea2b2b; background: #fff5f5; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 330px; margin: 0 auto; }
  .key { border: 2px solid #e5e5e5; border-bottom-width: 4px; background: #fff; border-radius: 12px;
         font: 900 22px inherit; color: #3c3c3c; padding: 12px 0; cursor: pointer; }
  .key:active { transform: translateY(2px); border-bottom-width: 2px; }
  .key.wide { grid-column: span 1; }
  .cmp-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 420px; margin: 6px auto; }
  .cmp-btn { border: 2px solid #e5e5e5; border-bottom-width: 4px; background: #fff; border-radius: 14px;
             padding: 18px 0; font: 900 30px inherit; cursor: pointer; }
  .cmp-btn.ok { background: #d7ffb8; border-color: #58cc02; color: #3f8000; }
  .cmp-btn.bad { background: #ffdfe0; border-color: #ff4b4b; color: #ea2b2b; }
  .cmp-row { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: clamp(22px, 4vw, 30px);
             font-weight: 900; margin: 18px 0; }
  .cmp-row .qmark { color: #1cb0f6; font-size: 34px; }
  .feedback { min-height: 30px; text-align: center; font-weight: 900; font-size: 15px; margin-top: 10px; }
  .feedback.ok { color: #58cc02; } .feedback.bad { color: #ff4b4b; }
  .round-bar { height: 12px; background: #e5e5e5; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .round-bar > i { display: block; height: 100%; width: 0; background: #58cc02; }
  .result { text-align: center; padding: 20px 10px; }
  .result .big { font-size: 56px; margin: 8px 0; }
  .result h2 { margin: 0 0 6px; }
  .hint { text-align: center; color: #999; font-weight: 700; font-size: 12px; margin-top: 12px; }
  .assist { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .assist .btn { font-size: 13px; }
  .opt-opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 330px; margin: 6px auto; }
  .opt-btn { border: 2px solid #e5e5e5; border-bottom-width: 4px; background: #fff; border-radius: 14px;
             padding: 16px 0; font: 900 28px inherit; color: #3c3c3c; cursor: pointer; }
  .opt-btn.ok { background: #d7ffb8; border-color: #58cc02; color: #3f8000; }
  .opt-btn.bad { background: #ffdfe0; border-color: #ff4b4b; color: #ea2b2b; }
</style>
</head>
<body>
<div class="story-deco" aria-hidden="true"><span>🍄</span><span>🌿</span><span>✨</span></div>
<div class="league-bg page-city page-train" id="pageCity" aria-hidden="true"></div>
<aside class="side" id="side"></aside>

<main class="main">
  <div class="wrap">
    <div class="hud" id="hud"></div>
    <div class="story-banner">
      <h1>✏️ Тренування</h1>
      <p class="muted" style="font-weight:700;font-size:13px">Приклади з підручників. Тут не знімаються серця ❤️ — просто тренуйся й заробляй бали ⚡.</p>
    </div>
    <div class="modes" id="modes"></div>
    <div id="train"></div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="train_bank.js?v=20261120a"></script>
<script src="game.js?v=20261120b"></script>
<script>
(function () {
  Game.renderSidebar("train");
  document.getElementById("hud").innerHTML = Game.hudHTML();
  (function () {
    var lg = Game.leagueOf(Game.load());
    var city = document.getElementById("pageCity");
    if (city) {
      var cityFile = lg.cur.city.replace(/\.(png|webp)$/, "") + "_train.webp";
      city.style.backgroundImage = 'url("' + cityFile + '?v=20261120a")';
    }
  })();

  var MODES = [
    { id: "add", label: "Додавання" },
    { id: "sub", label: "Віднімання" },
    { id: "mul", label: "Множення" },
    { id: "div", label: "Ділення" },
    { id: "big", label: "Великі числа" },
    { id: "chain", label: "Три дії" },
    { id: "times", label: "Двоцифрові" },
    { id: "mix", label: "Мішане" },
    { id: "cmp", label: "Порівняння" }
  ];
  var ROUND = 20;
  var bank = window.TRAIN_BANK || { add: [], sub: [], mul: [], div: [], cmp: [] };
  var mode = localStorage.getItem("train_mode") || "add";
  var queue = [], idx = 0, correct = 0, asked = 0, xp = 0, gemsEarned = 0, answered = false, typed = "";
  var RETRY_KEY = "train_retry_v1";

  function loadRetry() {
    try {
      var o = JSON.parse(localStorage.getItem(RETRY_KEY)) || {};
      var items = Array.isArray(o.items) ? o.items.filter(function (it) {
        return !(it && String(it.q || "").toLowerCase().indexOf("x") > -1);
      }) : [];
      return { items: items, since: typeof o.since === "number" ? o.since : 0 };
    } catch (e) { return { items: [], since: 0 }; }
  }
  function saveRetry(o) {
    try { localStorage.setItem(RETRY_KEY, JSON.stringify(o)); } catch (e) {}
  }
  function retryKey(item) {
    return item.type === "cmp" ? "cmp:" + item.l + "?" + item.r : "num:" + item.q;
  }
  function addRetry(item) {
    var o = loadRetry(), k = retryKey(item);
    if (o.items.some(function (x) { return retryKey(x) === k && x.mode === mode; })) { return; }
    o.items.push({ type: item.type, key: item.key, q: item.q, a: item.a,
                   l: item.l, r: item.r, ans: item.ans, mode: mode });
    saveRetry(o);
  }
  function removeRetry(item) {
    var o = loadRetry(), k = retryKey(item);
    o.items = o.items.filter(function (x) { return !(retryKey(x) === k && x.mode === mode); });
    saveRetry(o);
  }
  function maybeInsertRetry() {
    var o = loadRetry();
    if (o.since < 15 + Math.floor(Math.random() * 6)) { return; }
    var at = -1;
    for (var i = 0; i < o.items.length; i++) {
      if (o.items[i].mode === mode) { at = i; break; }
    }
    if (at < 0) { return; }
    var item = o.items.splice(at, 1)[0];
    o.since = 0;
    saveRetry(o);
    queue.splice(idx, 0, item);
  }

  function esc(s) { return Game.esc(s); }

  function renderModes() {
    var box = document.getElementById("modes");
    box.innerHTML = "";
    MODES.forEach(function (m) {
      var b = document.createElement("button");
      b.className = "mode" + (m.id === mode ? " on" : "");
      b.textContent = (Game.trainReady(m.id) ? "" : "⏳ ") + m.label;
      b.addEventListener("click", function () {
        mode = m.id;
        localStorage.setItem("train_mode", mode);
        renderModes();
        startRound();
      });
      box.appendChild(b);
    });
  }

  function pickQuestions(m) {
    var pool = [];
    if (m === "mix") {
      ["add", "sub", "mul", "div", "big", "chain", "times"].forEach(function (k) {
        bank[k].forEach(function (q) { pool.push({ type: "num", key: k, q: q.q, a: q.a }); });
      });
    } else if (m === "cmp") {
      bank.cmp.forEach(function (c) { pool.push({ type: "cmp", l: c.l, r: c.r, ans: c.ans }); });
    } else {
      bank[m].forEach(function (q) { pool.push({ type: "num", key: m, q: q.q, a: q.a }); });
    }
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, ROUND);
  }

  function startRound() {
    clearInterval(window._trainTimer);
    if (!Game.trainReady(mode)) { renderLocked(); return; }
    queue = pickQuestions(mode);
    idx = 0; correct = 0; asked = 0; xp = 0; gemsEarned = 0;
    renderQuestion();
  }

  function updateBar() {
    var bar = document.getElementById("roundBar");
    if (bar) { bar.style.width = Math.round(idx / Math.max(1, queue.length) * 100) + "%"; }
  }

  /* ---------- допомога за кристали: підказка і варіанти ---------- */
  var HINTS = {
    add:  "Якщо важко — додай спочатку до круглого десятка, а потім решту.",
    sub:  "Якщо важко — відніми спочатку до круглого десятка, а потім решту.",
    mul:  "Множення — це сума однакових доданків. Згадай таблицю множення.",
    div:  "Ділення — обернена дія до множення: підбери число, яке при множенні на дільник дасть ділене.",
    big:  "Рахуй порозрядно: спочатку десятки, потім одиниці.",
    chain: "Роби дії по черзі, зліва направо. Спочатку множення й ділення, потім додавання й віднімання.",
    times: "Згадай таблицю множення і ділення — вони обернені одне до одного.",
    mix:  "Порядок дій: спочатку множення й ділення, потім додавання й віднімання, зліва направо.",
    cmp:  "Обчисли кожен вираз окремо, потім порівняй результати. Дужки — завжди першими."
  };

  function distractors(a) {
    var cand = [a + 1, a - 1, a + 2, a - 2, a + 10, a - 10, a + 5, a - 5, a + 3, a - 3];
    for (var i = cand.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = cand[i]; cand[i] = cand[j]; cand[j] = t;
    }
    var out = [], seen = {};
    for (var k = 0; k < cand.length && out.length < 3; k++) {
      var n = cand[k];
      if (n >= 0 && n !== a && !seen[n]) { seen[n] = 1; out.push(n); }
    }
    while (out.length < 3) { out.push(a + 10 + out.length); }
    return out;
  }

  function renderNumOptions(cur) {
    var zone = document.getElementById("answerZone");
    if (!zone) { return []; }
    var opts = distractors(cur.a).concat([cur.a]);
    for (var i = opts.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = opts[i]; opts[i] = opts[j]; opts[j] = t;
    }
    zone.innerHTML = '<div class="opt-opts" id="numOpts">' +
      opts.map(function (n) { return '<button type="button" class="opt-btn" data-n="' + n + '">' + n + '</button>'; }).join("") +
      '</div>';
    var btns = [];
    Array.prototype.forEach.call(zone.querySelectorAll(".opt-btn"), function (b) {
      var ok = String(b.getAttribute("data-n")) === String(cur.a);
      b.addEventListener("click", function () {
        if (answered || b.disabled) { return; }
        b.classList.add(ok ? "ok" : "bad");
        if (!ok) { b.disabled = true; }
        finished(ok, cur);
        if (!ok) {
          Array.prototype.forEach.call(zone.querySelectorAll(".opt-btn"), function (x) {
            if (String(x.getAttribute("data-n")) === String(cur.a)) { x.classList.add("ok"); }
          });
        }
      });
      btns.push({ b: b, ok: ok });
    });
    return btns;
  }

  function buildAssist(cur) {
    var row = document.getElementById("assist");
    if (!row) { return; }
    row.innerHTML = "";
    var hintB = document.createElement("button");
    hintB.type = "button";
    hintB.className = "btn ghost";
    hintB.innerHTML = "🔊 Підказка · 2 💎";
    var hintBought = false;
    hintB.addEventListener("click", function () {
      if (!("speechSynthesis" in window)) { Game.toast("Озвучення не підтримується цим браузером"); return; }
      if (!hintBought) {
        var p = Game.load();
        if (p.gems < 2) { Game.toast("Не вистачає кристалів 💎 Правильна відповідь дає 3 💎!"); return; }
        Game.addGems(-2); hintBought = true;
        Game.syncHud();
        hintB.innerHTML = "🔊 Повторити підказку";
        Game.toast("Підказка · −2 💎");
      }
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(HINTS[mode] || HINTS.add);
        u.lang = "uk-UA"; u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    });
    row.appendChild(hintB);

    if (cur.type === "cmp") { return; }  /* порівняння вже має три варіанти */

    var optB = document.createElement("button");
    optB.type = "button";
    optB.className = "btn ghost";
    optB.innerHTML = "🎲 Варіанти · 3 💎";
    var stage = 0, curBtns = [];
    optB.addEventListener("click", function () {
      if (answered || stage >= 2) { return; }
      if (stage === 0) {
        var p = Game.load();
        if (p.gems < 3) { Game.toast("Не вистачає кристалів 💎 Правильна відповідь дає 3 💎!"); return; }
        Game.addGems(-3); stage = 1;
        Game.syncHud(); Game.toast("Варіанти відкрито · −3 💎");
        curBtns = renderNumOptions(cur);
        optB.innerHTML = "✂️ 50:50 · +2 💎";
      } else {
        var p2 = Game.load();
        if (p2.gems < 2) { Game.toast("Не вистачає кристалів 💎"); return; }
        Game.addGems(-2); stage = 2;
        Game.syncHud(); Game.toast("50:50 · −2 💎");
        var wrong = curBtns.filter(function (x) { return !x.ok && document.body.contains(x.b); });
        for (var i = wrong.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = wrong[i]; wrong[i] = wrong[j]; wrong[j] = t;
        }
        wrong.slice(0, 2).forEach(function (x) { x.b.remove(); });
        optB.style.display = "none";
      }
    });
    row.appendChild(optB);
  }

  function renderQuestion() {
    var host = document.getElementById("train");
    answered = false; typed = "";
    if (idx >= queue.length) { return renderResult(); }
    var cur = queue[idx];
    var p = Game.load();

    if (cur.type === "cmp") {
      host.innerHTML = '<div class="train-card">' +
        '<div class="round-bar"><i id="roundBar" style="width:' + Math.round(idx / Math.max(1, queue.length) * 100) + '%"></i></div>' +
        '<div class="muted" style="font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px">' +
        'Порівняй вирази · ' + (idx + 1) + ' з ' + queue.length + '</div>' +
        '<div class="cmp-row"><span>' + esc(cur.l) + '</span><span class="qmark">?</span><span>' + esc(cur.r) + '</span></div>' +
        '<div class="cmp-opts"><button class="cmp-btn" data-op="&gt;">&gt;</button>' +
        '<button class="cmp-btn" data-op="&lt;">&lt;</button>' +
        '<button class="cmp-btn" data-op="=">=</button></div>' +
        '<div class="assist" id="assist"></div>' +
        '<div class="feedback" id="fb"></div>' +
        '<div class="hint">Помилка не забирає серце — просто спробуй ще</div>' +
        '</div>';
      Array.prototype.forEach.call(host.querySelectorAll(".cmp-btn"), function (b) {
        b.addEventListener("click", function () {
          if (answered) { return; }
          var op = b.getAttribute("data-op");
          var ok = op === cur.ans;
          finished(ok, cur);
          b.classList.add(ok ? "ok" : "bad");
          if (!ok) {
            Array.prototype.forEach.call(host.querySelectorAll(".cmp-btn"), function (x) {
              if (x.getAttribute("data-op") === cur.ans) { x.classList.add("ok"); }
            });
          }
        });
      });
    } else {
      host.innerHTML = '<div class="train-card">' +
        '<div class="round-bar"><i id="roundBar" style="width:' + Math.round(idx / Math.max(1, queue.length) * 100) + '%"></i></div>' +
        '<div class="muted" style="font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px">' +
        'Обчисли · ' + (idx + 1) + ' з ' + queue.length + '</div>' +
        '<div class="qbig">' + esc(cur.q) + (cur.q.indexOf("=") > -1 ? "" : '<span class="eq">=</span>') + '</div>' +
        '<div id="answerZone">' +
        '<div class="answer" id="answer">' + (typed || "&nbsp;") + '</div>' +
        '<div class="keypad" id="keypad">' +
        [1,2,3,4,5,6,7,8,9].map(function (n) { return '<button class="key" data-k="' + n + '">' + n + '</button>'; }).join("") +
        '<button class="key" data-k="back">⌫</button><button class="key" data-k="0">0</button>' +
        '<button class="key" data-k="ok" style="background:#58cc02;color:#fff;border-color:#46a302">✓</button>' +
        '</div>' +
        '</div>' +
        '<div class="assist" id="assist"></div>' +
        '<div class="feedback" id="fb"></div>' +
        '<div class="hint">Введи відповідь і натисни ✓ (або Enter)</div>' +
        '</div>';
      document.getElementById("answer").innerHTML = typed || "&nbsp;";
      Array.prototype.forEach.call(host.querySelectorAll(".key"), function (k) {
        k.addEventListener("click", function () {
          var v = k.getAttribute("data-k");
          if (v === "back") { typed = typed.slice(0, -1); }
          else if (v === "ok") { submit(); return; }
          else if (typed.length < 4) { typed += v; }
          var a = document.getElementById("answer");
          a.textContent = typed || " ";
          a.className = "answer";
        });
      });
    }
    buildAssist(cur);
    updateBar();
    var stat = document.getElementById("statline");
    if (stat) {
      stat.textContent = "Правильно: " + p.practice.correct + " · Помилок: " + p.practice.wrong;
    }
  }

  function finished(ok, cur) {
    answered = true;
    asked++;
    var ro = loadRetry();
    ro.since += 1;
    saveRetry(ro);
    var fb = document.getElementById("fb");
    var gained = Game.awardPractice(ok, mode);
    xp += gained;
    if (ok) {
      correct++;
      removeRetry(cur);
      var gemMsg = "";
      Game.addGems(3); gemsEarned += 3; gemMsg = " · +3 💎";
      if (fb) { fb.className = "feedback ok"; fb.innerHTML = "Правильно! +" + gained + " XP · +3 <img src=\"art/icon_gem.webp?v=20261120b\" class=\"ico sm\" alt=\"\">"; }
      var box = document.getElementById("answer");
      if (box) { box.className = "answer ok"; }
      setTimeout(function () { idx++; maybeInsertRetry(); renderQuestion(); }, 850);
    } else {
      var right = cur.type === "cmp" ? cur.ans : cur.a;
      Game.markMistake(mode, cur.type === "cmp" ? { q: cur.l + " ? " + cur.r, a: cur.ans } : cur);
      addRetry(cur);
      if (fb) { fb.className = "feedback bad"; fb.textContent = "Правильна відповідь: " + right; }
      var ab = document.getElementById("answer");
      if (ab) { ab.className = "answer bad"; }
      var host = document.getElementById("train");
      var btn = document.createElement("div");
      btn.style.cssText = "text-align:center;margin-top:14px";
      btn.innerHTML = '<button class="btn" id="nextQ">Далі →</button>';
      host.querySelector(".train-card").appendChild(btn);
      document.getElementById("nextQ").addEventListener("click", function () { idx++; maybeInsertRetry(); renderQuestion(); });
    }
    Game.syncHud();
  }

  function submit() {
    if (answered) { return; }
    var cur = queue[idx];
    if (typed === "") { return; }
    var ok = String(cur.a) === typed;
    finished(ok, cur);
  }

  function renderLocked() {
    var host = document.getElementById("train");
    function draw() {
      var left = Math.ceil(Game.trainLeft(mode) / 1000);
      if (left <= 0) { startRound(); return; }
      var m = Math.floor(left / 60), sec = left % 60;
      host.innerHTML = '<div class="train-card result">' +
        '<div class="big">⏳</div>' +
        '<h2>Відпочинок</h2>' +
        '<div class="muted" style="font-weight:800;margin-bottom:14px">' +
        'Цей розділ тренування вже пройдено. Наступний раз — через ' +
        (m > 0 ? (m + ' хв ') : '') + (sec < 10 ? '0' : '') + sec + ' с.</div>' +
        '<a class="btn ghost" href="index.html">До карти</a></div>';
    }
    draw();
    clearInterval(window._trainTimer);
    window._trainTimer = setInterval(draw, 1000);
  }

  function nextMode() {
    for (var i = 0; i < MODES.length; i++) {
      var m = MODES[i];
      if (m.id !== mode && Game.trainReady(m.id) && m.id !== "cmp") { return m; }
    }
    for (var j = 0; j < MODES.length; j++) {
      if (MODES[j].id !== mode && Game.trainReady(MODES[j].id)) { return MODES[j]; }
    }
    return null;
  }

  function renderResult() {
    Game.finishPracticeRound();
    Game.trainMark(mode);
    var host = document.getElementById("train");
    var emoji = correct === asked ? "🏆" : correct >= Math.ceil(asked * 0.7) ? "🎉" : "💪";
    var nx = nextMode();
    function draw() {
      var left = Math.ceil(Game.trainLeft(mode) / 1000);
      var mm = Math.floor(left / 60), ss = left % 60;
      host.innerHTML = '<div class="train-card result">' +
        '<div class="big">' + emoji + '</div>' +
        '<h2>' + correct + ' з ' + queue.length + '</h2>' +
        '<div class="muted" style="font-weight:800;margin-bottom:6px">Зароблено ' + xp + ' XP і ' + gemsEarned + ' 💎 · 3 💎 за кожну правильну</div>' +
        '<div style="font-weight:900;color:#ff9600;margin-bottom:16px">⏳ Цей розділ — через ' +
        (mm > 0 ? mm + ' хв ' : '') + (ss < 10 ? '0' : '') + ss + ' с</div>' +
        (nx ? '<button class="btn" id="nextMode">Далі: ' + nx.label + '</button> ' : '') +
        '<a class="btn ghost" href="index.html" style="margin-left:8px">До карти</a>' +
        '<div class="hint">Кожен розділ тренування — раз на 5 хвилин</div></div>';
      var b = document.getElementById("nextMode");
      if (b) {
        b.addEventListener("click", function () {
          clearInterval(window._trainTimer);
          mode = nx.id;
          localStorage.setItem("train_mode", mode);
          renderModes();
          startRound();
        });
      }
    }
    draw();
    clearInterval(window._trainTimer);
    window._trainTimer = setInterval(draw, 1000);
    Game.syncHud();
  }

  document.addEventListener("keydown", function (e) {
    if (mode === "cmp") { return; }
    if (e.key >= "0" && e.key <= "9") {
      if (typed.length < 4) { typed += e.key; }
      var a = document.getElementById("answer");
      if (a) { a.textContent = typed || " "; a.className = "answer"; }
      e.preventDefault();
    } else if (e.key === "Backspace") {
      typed = typed.slice(0, -1);
      var b = document.getElementById("answer");
      if (b) { b.textContent = typed || " "; b.className = "answer"; }
      e.preventDefault();
    } else if (e.key === "Enter") {
      submit(); e.preventDefault();
    }
  });

  renderModes();
  startRound();
})();
</script>
</body>
</html>
