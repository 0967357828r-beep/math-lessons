<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок — Тімолінго</title>
<link rel="stylesheet" href="game.css?v=20261115b">
</head>
<body>
<aside class="side" id="side"></aside>

<main class="main">
  <div class="lesson">
    <div class="lesson-top">
      <a class="x" href="index.html" title="До карти">✕</a>
      <div class="bar"><i id="bar" style="width:0%"></i></div>
      <span class="chip lives">❤️ <b id="lives">10</b></span>
    </div>
    <div id="lesson"></div>
  </div>
</main>

<audio id="ding" preload="auto" src="ding.mp3"></audio>
<div class="toast" id="toast"></div>
<script src="tasks.js?v=20261115b"></script>
<script src="game.js?v=20261115b"></script>
<script>
(function () {
  Game.renderSidebar("learn");
  var params = new URLSearchParams(location.search);
  var id = params.get("id");
  var task = Game.taskById(id);
  var host = document.getElementById("lesson");
  var started = Date.now();

  function syncHud() {
    var p = Game.load();
    var hud = document.getElementById("hud");
    if (hud) { hud.innerHTML = Game.hudHTML(); }
    var lives = document.getElementById("lives");
    if (lives) { lives.textContent = p.lives; }
  }
  function playDing() {
    var el = document.getElementById("ding");
    try {
      el.currentTime = 0;
      var pr = el.play();
      if (pr && pr.catch) { pr.catch(function () {}); }
    } catch (e) {}
  }
  function confetti(x, y) {
    var c = document.createElement("canvas");
    c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999";
    c.width = innerWidth; c.height = innerHeight;
    document.body.appendChild(c);
    var ctx = c.getContext("2d");
    var cols = ["#58cc02", "#1cb0f6", "#ffc800", "#ce82ff", "#ff9600", "#ff4b4b"];
    var parts = [], i;
    for (i = 0; i < 90; i++) {
      var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
                   r: 2 + Math.random() * 4, col: cols[i % cols.length],
                   life: 60 + Math.random() * 30, rot: Math.random() * 6 });
    }
    var f = 0;
    (function tick() {
      ctx.clearRect(0, 0, c.width, c.height); f++;
      parts.forEach(function (p) {
        p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.life--;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + f * 0.1);
        ctx.fillStyle = p.col; ctx.globalAlpha = Math.max(0, p.life / 80);
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2); ctx.restore();
      });
      if (f < 110) { requestAnimationFrame(tick); } else { c.remove(); }
    })();
  }

  if (!task) {
    host.innerHTML = '<h1>Урок не знайдено</h1><p class="muted">Можливо, посилання застаріле.</p>' +
                     '<a class="btn blue" href="index.html">До карти</a>';
    return;
  }

  var pos = Game.positionOf(task.id);
  var sec = pos ? Game.SECTIONS[pos.section] : null;
  var p0 = Game.load();
  document.title = task.title + " — Тімолінго";
  host.innerHTML =
    '<div class="lesson-kicker">' + (sec ? "Розділ " + (sec.index + 1) + " · " + Game.esc(sec.title) : "Урок") + '</div>' +
    '<h1>' + Game.esc(task.title) + '</h1>' +
    '<p class="task">' + Game.esc(task.text) + '</p>' +
    '<div class="video-box"><video id="video" controls playsinline preload="metadata"></video></div>' +
    '<div class="quiz"><div class="qtitle">Обери відповідь: <span class="muted" style="font-weight:700;font-size:12px">натисни — перевіримо одразу</span></div>' +
    '<div class="qopts" id="opts"></div><div class="qmsg" id="msg"></div></div>' +
    '<div class="row"><button class="btn ghost" id="showAns" style="display:none">💡 Показати розв\'язок</button>' +
    '<a class="btn next" id="next" href="index.html" style="display:none">Далі →</a>' +
    '<a class="btn ghost" href="index.html">До карти</a></div>' +
    '<div class="ansbox" id="ansbox"><ol id="steps"></ol><audio id="ansAudio" preload="none"></audio>' +
    '<div class="muted" style="font-size:12px;font-weight:800">🔊 Розв\'язок озвучений</div></div>';

  document.getElementById("video").src = task.video;
  document.getElementById("steps").innerHTML = task.steps.map(function (s) { return "<li>" + Game.esc(s) + "</li>"; }).join("");
  document.getElementById("ansAudio").src = task.audio;
  var pct = 0;
  if (pos) { pct = Math.round((pos.lesson + 1) / sec.ids.length * 100); }
  document.getElementById("bar").style.width = Math.min(100, pct) + "%";

  var lives = p0.lives;
  if (lives <= 0) {
    document.getElementById("showAns").style.display = "inline-flex";
    document.getElementById("opts").innerHTML =
      '<div style="grid-column:1/-1;font-weight:800;color:#ea2b2b">❤️ Життя закінчились. Відновляться завтра — або на карті за 10 💎.</div>';
  }

  var opts = document.getElementById("opts");
  var items = task.options.map(function (text, i) { return { text: text, ok: i === task.correct }; });
  for (var i = items.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
  }
  var attempts = 0, solved = false;

  items.forEach(function (item) {
    var b = document.createElement("button");
    b.className = "qopt"; b.type = "button"; b.textContent = item.text;
    b.addEventListener("click", function () {
      if (solved) { return; }
      if (item.ok) {
        solved = true;
        b.classList.add("ok");
        playDing();
        var r = b.getBoundingClientRect();
        confetti(r.left + r.width / 2, r.top + r.height / 2);
        var seconds = Math.round((Date.now() - started) / 1000);
        var reward = Game.awardLesson(task.id, attempts === 0, seconds);
        var pr = Game.load();
        var msg = "Молодець! 🎉 +" + reward.xp + " XP";
        if (!reward.trophy && reward.gems === 1) {
          msg += " · 💎 +1 за урок без помилок";
        }
        document.getElementById("msg").textContent = msg;
        if (reward.trophy) { showTrophy(reward.trophy); }
        document.querySelectorAll(".qopt").forEach(function (o) { o.disabled = true; });
        var ab = document.getElementById("ansbox");
        var sb = document.getElementById("showAns");
        ab.classList.add("show");
        sb.style.display = "inline-flex";
        sb.textContent = "🙈 Сховати розв'язок";
        try {
          var aa = document.getElementById("ansAudio");
          aa.currentTime = 0;
          var ap = aa.play(); if (ap && ap.catch) { ap.catch(function () {}); }
        } catch (e) {}
        var nx = document.getElementById("next");
        var nid = Game.nextLessonId(task.id);
        nx.href = nid ? "level.html?id=" + encodeURIComponent(nid) : "index.html";
        nx.style.display = "inline-flex";
        syncHud();
        if (pr.lives <= 0) { Game.toast("Життя закінчились — віднови на карті"); }
      } else {
        attempts++;
        b.classList.add("bad"); b.disabled = true;
        var left = Game.loseLife();
        syncHud();
        if (left <= 0) {
          document.querySelectorAll(".qopt").forEach(function (o) { o.disabled = true; });
          document.getElementById("msg").textContent = "❤️ Життя закінчились. Відновляться завтра — або на карті за 10 💎.";
        } else {
          document.getElementById("msg").textContent = "Спробуй ще 🙂 ❤️ " + left;
        }
      }
    });
    opts.appendChild(b);
  });

  document.getElementById("showAns").addEventListener("click", function () {
    var box = document.getElementById("ansbox");
    var a = document.getElementById("ansAudio");
    if (!box.classList.contains("show")) {
      box.classList.add("show");
      this.textContent = "🙈 Сховати розв'язок";
      try { a.currentTime = 0; var pr = a.play(); if (pr && pr.catch) { pr.catch(function () {}); } } catch (e) {}
    } else {
      box.classList.remove("show");
      this.textContent = "💡 Показати розв'язок";
      try { a.pause(); } catch (e) {}
    }
  });

  function showTrophy(t) {
    var ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(20,20,20,.55);display:flex;" +
      "align-items:center;justify-content:center;z-index:1000;padding:16px";
    ov.innerHTML = '<div style="background:#fff;border-radius:24px;padding:28px 24px;max-width:380px;' +
      'text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.3)">' +
      '<div style="font-size:76px;line-height:1;margin-bottom:8px">🏆</div>' +
      '<div style="font-size:11px;font-weight:900;letter-spacing:2px;color:#999;text-transform:uppercase">Кубок розділу</div>' +
      '<h2 style="margin:6px 0 4px;font-size:22px">' + Game.esc(t.title) + '</h2>' +
      '<div style="font-weight:800;color:#777;margin-bottom:14px">Розділ пройдено повністю!</div>' +
      '<div style="font-size:30px;font-weight:900;color:#1cb0f6;margin-bottom:18px">+5 💎</div>' +
      '<button id="trophyOk" style="border:0;border-radius:14px;padding:13px 22px;font:900 14px inherit;' +
      'background:#58cc02;color:#fff;cursor:pointer">Забрати кубок</button></div>';
    document.body.appendChild(ov);
    try { document.getElementById("ding").play(); } catch (e) {}
    document.getElementById("trophyOk").addEventListener("click", function () { ov.remove(); });
  }

  syncHud();
})();
</script>
</body>
</html>
