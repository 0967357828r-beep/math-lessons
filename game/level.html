<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 14px 90px; min-height: 100vh;
    font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif; color: #3a2d1f;
    background: linear-gradient(180deg, #9fe3ff 0%, #cdf3ff 34%, #eafbd6 68%, #d7efb2 100%);
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .back { text-decoration: none; font-size: 26px; line-height: 1; background: #fff; border: 4px solid #ffd166;
          border-radius: 14px; padding: 4px 12px; color: #7a5b12; }
  .hud { margin-left: auto; display: flex; gap: 8px; }
  .chip { background: #fffdf7; border: 3px solid #8ecae6; border-radius: 14px; padding: 5px 10px;
          font-weight: 700; font-size: 14px; }
  h1 { font-size: clamp(20px, 4.4vw, 28px); margin: 6px 0 10px; color: #ff5c8a;
       text-shadow: 2px 2px 0 #fff; }
  .task { background: #fff8e3; border: 4px dashed #ffd166; border-radius: 18px; padding: 12px 14px;
          font-size: 16px; line-height: 1.5; margin-bottom: 14px; }
  video { width: 100%; border-radius: 18px; border: 4px solid #ffd166; background: #000; display: block; }
  .quiz { margin-top: 16px; }
  .qtitle { font-weight: 700; margin-bottom: 8px; color: #6b5a45; }
  .qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qopt { cursor: pointer; border: 4px solid #ffd166; background: #fff; color: #4a3b2c;
          border-radius: 16px; padding: 12px 10px; font: 700 16px inherit; transition: transform .12s ease; }
  .qopt:hover:not(:disabled) { transform: translateY(-2px); background: #fffbe8; }
  .qopt.ok { background: #c8f7c5; border-color: #4caf50; }
  .qopt.bad { background: #ffd6d6; border-color: #e53935; opacity: .8; }
  .qmsg { min-height: 24px; font-weight: 700; color: #4caf50; margin-top: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn { border: 4px solid #7ee0b8; background: #fff; color: #1f6b4c; font: 700 15px inherit;
         border-radius: 16px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { background: #f0fff9; }
  .btn.next { border-color: #ff5c8a; color: #a3284d; display: none; }
  .btn.next.show { display: inline-block; }
  .ansbox { margin-top: 14px; background: #f3ffe9; border: 4px dashed #7ec86a; border-radius: 16px;
            padding: 12px 14px; display: none; }
  .ansbox.show { display: block; }
  .ansbox ol { margin: 0 0 8px 20px; padding: 0; }
  .ansbox li { margin-bottom: 6px; line-height: 1.45; }
  .stars { font-size: 34px; letter-spacing: 4px; margin: 10px 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
           background: #3a2d1f; color: #fff; padding: 10px 16px; border-radius: 14px; opacity: 0;
           transition: all .25s ease; font-size: 14px; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<script>
const KEY = "mathgame_v1";
const params = new URLSearchParams(location.search);
const id = params.get("id");
const task = (window.TASKS || []).find(t => t.id === id);

function load() {
  let p;
  try { p = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { p = {}; }
  p.levels = p.levels || {};
  p.xp = p.xp || 0;
  p.streak = p.streak || 0;
  p.last = p.last || null;
  p.gems = p.gems || 0;
  p.lives = typeof p.lives === "number" ? p.lives : 10;
  p.livesDate = p.livesDate || new Date().toISOString().slice(0, 10);
  Object.keys(p.levels).forEach(k => {
    const l = p.levels[k];
    if (typeof l.gems !== "number") { l.gems = l.stars || 0; }
    delete l.stars;
  });
  const today = new Date().toISOString().slice(0, 10);
  if (p.livesDate !== today) { p.lives = 10; p.livesDate = today; }
  return p;
}
function save(p) { localStorage.setItem(KEY, JSON.stringify(p)); }
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
function playDing() {
  const el = document.getElementById("ding");
  try { el.currentTime = 0; const p = el.play(); if (p && p.catch) { p.catch(() => {}); } } catch (e) {}
}
function confetti(x, y) {
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999";
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const ctx = c.getContext("2d"), cols = ["#ff5c8a","#ffd166","#7ee0b8","#8ecae6","#c9a7ff","#ffa45c"];
  const parts = [];
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
    parts.push({x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 4, r: 2 + Math.random()*4,
                col: cols[i % cols.length], life: 60 + Math.random()*30, rot: Math.random()*6});
  }
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height); f++;
    parts.forEach(p => {
      p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.life--;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + f*0.1);
      ctx.fillStyle = p.col; ctx.globalAlpha = Math.max(0, p.life/80);
      ctx.fillRect(-p.r, -p.r, p.r*2, p.r*2); ctx.restore();
    });
    if (f < 110) { requestAnimationFrame(tick); } else { c.remove(); }
  })();
}

if (!task) {
  document.getElementById("title").textContent = "Рівень не знайдено";
} else {
  document.title = task.title + " — Задачі-мультфільми";
  document.getElementById("title").textContent = task.title;
  document.getElementById("task").textContent = task.text;
  document.getElementById("video").src = task.video;
  document.getElementById("steps").innerHTML = task.steps.map(s => "<li>" + s + "</li>").join("");
  document.getElementById("ansAudio").src = task.audio;

  const p = load();
  document.getElementById("xp").textContent = p.xp || 0;
  document.getElementById("gems").textContent = p.gems || 0;
  document.getElementById("lives").textContent = p.lives;
  if (p.lives <= 0) {
    document.getElementById("opts").innerHTML =
      '<div style="grid-column:1/-1;font-weight:700;color:#a3284d">❤️ Життя закінчились. ' +
      'Відновляться завтра — або на карті за 3 💎.</div>';
    document.getElementById("showAns").style.display = "inline-block";
  }

  const opts = document.getElementById("opts");
  const items = task.options.map((text, i) => ({text, ok: i === task.correct}));
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  let attempts = 0, solved = false;
  items.forEach(item => {
    const b = document.createElement("button");
    b.className = "qopt"; b.type = "button"; b.textContent = item.text;
    b.addEventListener("click", () => {
      if (solved) { return; }
      if (item.ok) {
        solved = true;
        b.classList.add("ok");
        playDing();
        const r = b.getBoundingClientRect();
        confetti(r.left + r.width/2, r.top + r.height/2);
        const pr = load();
        const prev = pr.levels[task.id] || {gems: 0, done: false};
        const earned = 1 + (attempts === 0 ? 1 : 0);
        pr.levels[task.id] = {done: true, gems: Math.max(prev.gems || 0, earned)};
        pr.gems = (pr.gems || 0) + earned;
        pr.xp = (pr.xp || 0) + 10;
        const today = new Date().toISOString().slice(0, 10);
        if (pr.last !== today) {
          const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
          pr.streak = pr.last === y ? (pr.streak || 0) + 1 : 1;
          pr.last = today;
        }
        save(pr);
        document.getElementById("msg").innerHTML =
          "Молодець! 🎉 " + "💎".repeat(earned) + " +10 XP";
        document.getElementById("xp").textContent = pr.xp;
        document.getElementById("gems").textContent = pr.gems;
        document.querySelectorAll(".qopt").forEach(o => o.disabled = true);
        document.getElementById("next").classList.add("show");
      } else {
        attempts++;
        b.classList.add("bad"); b.disabled = true;
        const pr = load();
        pr.lives = Math.max(0, pr.lives - 1);
        save(pr);
        document.getElementById("lives").textContent = pr.lives;
        if (pr.lives <= 0) {
          document.querySelectorAll(".qopt").forEach(o => o.disabled = true);
          document.getElementById("msg").textContent =
            "❤️ Життя закінчились. Відновляться завтра — або на карті за 3 💎.";
        } else {
          document.getElementById("msg").textContent = "Спробуй ще 🙂 ❤️ " + pr.lives;
        }
      }
    });
    opts.appendChild(b);
  });

  document.getElementById("showAns").addEventListener("click", () => {
    const box = document.getElementById("ansbox");
    box.classList.add("show");
    const a = document.getElementById("ansAudio");
    try { a.currentTime = 0; const pr = a.play(); if (pr && pr.catch) { pr.catch(() => {}); } } catch (e) {}
  });
}
</script>
