<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок — Тімолінго</title>
<link rel="stylesheet" href="game.css?v=20261125i">
<style>
  .steps { display:flex; gap:6px; align-items:center; margin:10px 0 4px; }
  .steps i { width:24px; height:8px; border-radius:6px; background:#e5e5e5; display:block; }
  .steps i.on { background:#58cc02; } .steps i.ok { background:#ffc800; }
  .step-label { font-size:12px; font-weight:900; color:#1cb0f6; text-transform:uppercase;
                letter-spacing:1px; margin-bottom:10px; }
  .kbig { font-size:clamp(26px,5vw,40px); font-weight:900; text-align:center; margin:12px 0; }
  .kanswer { min-height:58px; border:3px solid #e5e5e5; border-radius:14px; display:flex;
             align-items:center; justify-content:center; font-size:32px; font-weight:900;
             color:#1cb0f6; margin:10px 0; background:#fafafa; }
  .kanswer.ok { border-color:#58cc02; color:#3f8000; background:#f0fff4; }
  .kanswer.bad { border-color:#ff4b4b; color:#ea2b2b; background:#fff5f5; }
  .kpad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:330px; margin:0 auto; }
  .kpad button { border:2px solid #e5e5e5; border-bottom-width:4px; background:#fff;
                 border-radius:12px; font:900 21px inherit; padding:11px 0; cursor:pointer; color:#3c3c3c; }
  .kpad button.go { background:#58cc02; color:#fff; border-color:#46a302; }
  .stage-msg { min-height:26px; font-weight:900; margin-top:10px; color:#58cc02; font-size:15px; }
  .stage-msg.bad { color:#ff4b4b; }
  .repeat-btn { background:#ff9600; box-shadow:0 4px 0 #cc7800; }
  .lesson-done { text-align:center; padding:18px 10px; }
  .lesson-done .big { font-size:52px; }
  .img-box img { width:100%; border-radius:14px; display:block; }
  /* кнопка озвучки умови — крупна і зелена (Пан Роман, 21.11.2026) */
  #playCond { font-size: 22px !important; font-weight: 900 !important; color: #9ccc65 !important;
              padding: 14px 26px !important; border: 2px solid rgba(156,204,101,.55) !important;
              max-width: 400px !important; border-radius: 14px !important; }
</style>
</head>
<body>
<div class="story-deco" aria-hidden="true"><span>🍄</span><span>🌿</span><span>✨</span></div>
<aside class="side" id="side"></aside>

<main class="main">
  <div class="lesson">
    <div class="lesson-top">
      <a class="x" href="index.html" title="До карти">✕</a>
      <div class="bar"><i id="bar" style="width:0%"></i></div>
      <span class="chip lives">❤️ <b id="lives">10</b></span>
    </div>
    <div class="hud" id="hud"></div>
    <div id="lesson"></div>
  </div>
</main>

<audio id="ding" preload="auto" src="ding.mp3"></audio>
<div class="toast" id="toast"></div>
<script src="train_bank.js?v=20261125i"></script>
<script src="tasks.js?v=20261125i"></script>
<script src="game.js?v=20261125i"></script>
<script>
(function () {
  Game.renderSidebar("learn");
  var params = new URLSearchParams(location.search);
  var id = params.get("id");
  var task = Game.taskById(id);
  var host = document.getElementById("lesson");
  var started = Date.now();

  function syncHud() {
    var p = Game.load();
    var hud = document.getElementById("hud");
    if (hud) { hud.innerHTML = Game.hudHTML(); }
    var lives = document.getElementById("lives");
    if (lives) { lives.textContent = p.lives; }
  }
  function playDing() {
    var el = document.getElementById("ding");
    try {
      el.currentTime = 0;
      var pr = el.play();
      if (pr && pr.catch) { pr.catch(function () {}); }
    } catch (e) {}
  }
  function confetti(x, y) {
    var c = document.createElement("canvas");
    c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999";
    c.width = innerWidth; c.height = innerHeight;
    document.body.appendChild(c);
    var ctx = c.getContext("2d");
    var cols = ["#58cc02", "#1cb0f6", "#ffc800", "#ce82ff", "#ff9600", "#ff4b4b"];
    var parts = [], i;
    for (i = 0; i < 90; i++) {
      var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
                   r: 2 + Math.random() * 4, col: cols[i % cols.length],
                   life: 60 + Math.random() * 30, rot: Math.random() * 6 });
    }
    var f = 0;
    (function tick() {
      ctx.clearRect(0, 0, c.width, c.height); f++;
      parts.forEach(function (p) {
        p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.life--;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + f * 0.1);
        ctx.fillStyle = p.col; ctx.globalAlpha = Math.max(0, p.life / 80);
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2); ctx.restore();
      });
      if (f < 110) { requestAnimationFrame(tick); } else { c.remove(); }
    })();
  }

  if (!task) {
    host.innerHTML = '<h1>Урок не знайдено</h1><p class="muted">Можливо, посилання застаріле.</p>' +
                     '<a class="btn blue" href="index.html">До карти</a>';
    return;
  }

  var pos = Game.positionOf(task.id);
  var sec = pos ? Game.SECTIONS[pos.section] : null;
  var mode = pos ? (Game.LESSON_MODE[sec.id] || "add") : "add";
  var p0 = Game.load();
  document.title = task.title + " — Тімолінго";
  var hud = document.getElementById("hud");
  if (hud) { hud.innerHTML = Game.hudHTML(); }

  host.innerHTML =
    '<div class="lesson-kicker">' + (sec ? "Розділ " + (sec.index + 1) + " · " + Game.esc(sec.title) : "Урок") + '</div>' +
    '<h1>' + Game.esc(task.title) + '</h1>' +
    '<p class="task">' + Game.esc(task.text) + '</p>' +
    (task.img
      ? '<div class="video-box img-box"><img id="taskImg" alt=""><button type="button" class="btn ghost" id="playCond" style="margin:12px auto 0;max-width:300px;display:flex">🔊 Послухати умову</button></div>'
      : '<div class="video-box"><video id="video" controls playsinline preload="metadata"></video></div>') +
    '<div class="steps" id="dots"></div>' +
    '<div class="quiz" id="stage"></div>' +
    '<div class="stage-msg" id="msg"></div>' +
    '<div class="row" id="actionRow">' +
      '<button class="btn ghost" id="showAns" style="display:none">💡 Показати розв\'язок</button>' +
      '<a class="btn next" id="next" href="index.html" style="display:none">Далі →</a>' +
      '<a class="btn ghost" href="index.html">До карти</a>' +
    '</div>' +
    '<div class="ansbox" id="ansbox"><ol id="stepsList"></ol><audio id="ansAudio" preload="none"></audio>' +
    '<div class="muted" style="font-size:12px;font-weight:800">🔊 Розв\'язок озвучений</div></div>';

  if (task.img) {
    document.getElementById("taskImg").src = task.img;
    var playCond = document.getElementById("playCond");
    if (playCond) {
      playCond.addEventListener("click", function () {
        var el = document.getElementById("condAudio");
        if (!el) {
          el = document.createElement("audio");
          el.id = "condAudio";
          el.preload = "auto";
          document.body.appendChild(el);
        }
        el.src = task.condAudio;
        try {
          el.currentTime = 0;
          var pr = el.play();
          if (pr && pr.catch) { pr.catch(function () { Game.toast("Аудіо недоступне"); }); }
        } catch (e) { Game.toast("Аудіо недоступне"); }
      });
    }
  } else {
    document.getElementById("video").src = task.video;
  }
  document.getElementById("stepsList").innerHTML = task.steps.map(function (s) { return "<li>" + Game.esc(s) + "</li>"; }).join("");
  document.getElementById("ansAudio").src = task.audio;
  var pct = 0;
  if (pos) { pct = Math.round((pos.lesson + 1) / sec.ids.length * 100); }
  document.getElementById("bar").style.width = Math.min(100, pct) + "%";

  function ukVoice(cb) {
    var settled = false;
    function finish(v) { if (!settled) { settled = true; cb(v); } }
    function look() {
      var v = window.speechSynthesis.getVoices() || [];
      var uk = v.filter(function (x) { return (x.lang || "").toLowerCase().indexOf("uk") === 0; });
      if (uk.length) { finish(uk[0]); return true; }
      if (v.length) { finish(null); return true; }
      return false;
    }
    if (look()) { return; }
    window.speechSynthesis.onvoiceschanged = function () {
      window.speechSynthesis.onvoiceschanged = null;
      look();
    };
    setTimeout(function () { finish(null); }, 1500);
  }
  try { window.speechSynthesis.getVoices(); } catch (e) {}   /* прогріваємо список голосів одразу */

  var LESSON_HINTS = {
    add: "Подумай: що в задачі відомо, а що треба знайти. Скільки всього — це додавання. На скільки більше чи менше — віднімання.",
    mul: "У кілька разів більше — це множення. У кілька разів менше — ділення. По скільки в кожному і скільки разів — теж множення.",
    div: "Розклали порівну — це ділення: загальну кількість поділи на кількість частин."
  };
  function hintText() {
    return LESSON_HINTS[mode] || "Перечитай питання задачі. Що відомо? Що треба знайти? Подумай, яку дію зробити першою.";
  }
  function makeHintButton() {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn ghost";
    b.innerHTML = "🔊 Підказка · 2 💎";
    var bought = false;
    function tryAudio(src, onFail) {
      var el = document.getElementById("hintAudio");
      if (!el) {
        el = document.createElement("audio");
        el.id = "hintAudio";
        el.preload = "auto";
        document.body.appendChild(el);
      }
      var tried = false;
      function fail() {
        if (tried) { return; }
        tried = true;
        el.onerror = null;
        onFail();
      }
      el.onerror = fail;
      if (el.getAttribute("data-src") !== src) {
        try { el.pause(); } catch (e) {}
        el.src = src;
        el.setAttribute("data-src", src);
      }
      try {
        el.currentTime = 0;
        var pr = el.play();
        if (pr && pr.then) { pr.then(function () { el.onerror = null; }, fail); }
      } catch (e) { fail(); }
    }
    function playHintAudio() {
      /* персональна підказка задачі → універсальна розділу → телефонний голос → текст */
      tryAudio("../hints/task_" + task.id + ".mp3", function () {
        tryAudio("../hints/hint_" + (LESSON_HINTS[mode] ? mode : "universal") + ".mp3", speakFallback);
      });
    }
    function charge() {
      var p = Game.load();
      if (p.gems < 2) { Game.toast("Не вистачає кристалів 💎 Потренуйся — там їх заробиш!"); return false; }
      Game.addGems(-2); bought = true;
      Game.syncHud();
      b.innerHTML = "🔊 Повторити підказку";
      Game.toast("Підказка · −2 💎");
      return true;
    }
    function showHintText() {
      var row = b.parentElement;
      if (!row) { return; }
      var old = document.getElementById("hintTextPanel");
      if (old) { old.remove(); }
      var t = document.createElement("div");
      t.id = "hintTextPanel";
      t.style.cssText = "width:100%;margin-top:6px;text-align:center;font-weight:800;font-size:14px;color:#3f8000";
      t.textContent = "💡 " + hintText();
      row.appendChild(t);
    }
    function speakFallback() {
      /* страховка: mp3 не завантажився → телефонний голос; нема і його → текст */
      if ("speechSynthesis" in window) {
        ukVoice(function (voice) {
          if (!voice) { showHintText(); return; }
          try {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(hintText());
            u.voice = voice; u.lang = voice.lang; u.rate = 0.9;
            window.speechSynthesis.speak(u);
          } catch (e) { showHintText(); }
        });
      } else { showHintText(); }
    }
    b.addEventListener("click", function () {
      if (!bought) {
        if (!charge()) { return; }
      }
      playHintAudio();
    });
    return b;
  }

  var steps = [{ type: "main" }, { type: "finish" }];
  var totalQuestions = steps.filter(function (s) { return s.type !== "finish"; }).length;
  var si = 0, attempts = 0, wrongAny = false, outOfLives = false, submitCurrent = null;

  function dots() {
    var el = document.getElementById("dots");
    if (totalQuestions <= 1) { if (el) { el.style.display = "none"; } return; }
    var h = "";
    for (var i = 0; i < totalQuestions; i++) {
      h += '<i class="' + (i < si ? "ok" : i === si ? "on" : "") + '"></i>';
    }
    if (el) { el.innerHTML = h; }
  }
  function msg(text, bad) {
    var m = document.getElementById("msg");
    if (m) { m.textContent = text; m.className = "stage-msg" + (bad ? " bad" : ""); }
  }
  function disableStage() {
    Array.prototype.forEach.call(document.querySelectorAll("#stage button"), function (b) { b.disabled = true; });
    submitCurrent = null;
  }
  function playAnswerAudio() {
    try {
      var aa = document.getElementById("ansAudio");
      aa.currentTime = 0;
      var ap = aa.play(); if (ap && ap.catch) { ap.catch(function () {}); }
    } catch (e) {}
  }
  function revealAnswer(play) {
    document.getElementById("ansbox").classList.add("show");
    var sb = document.getElementById("showAns");
    sb.style.display = "inline-flex";
    sb.textContent = "🙈 Сховати розв'язок";
    if (play !== false) { playAnswerAudio(); }
  }

  function showOutOfLives() {
    if (outOfLives) { return; }
    outOfLives = true;
    disableStage();
    msg("❤️ Життя закінчились. Відновляться завтра — або на карті за " + Game.HEAL_COST + " 💎.", true);
    var row = document.getElementById("actionRow");
    if (!document.getElementById("repeatTomorrow")) {
      var rb = document.createElement("button");
      rb.className = "btn repeat-btn";
      rb.id = "repeatTomorrow";
      rb.textContent = "🔁 Повторити завтра";
      rb.addEventListener("click", function () {
        Game.markRepeat(task.id);
        Game.toast("Урок «" + task.title + "» у черзі на завтра 🔁");
        location.href = "index.html";
      });
      row.insertBefore(rb, row.firstChild);
    }
    revealAnswer();
  }

  function advance() {
    si++;
    dots();
    setTimeout(renderStep, 420);
  }

  /* Придатність задачі до поля вводу: відповідь «число + ≤2 слова без цифр» */
  function mainAnswerInfo() {
    var ans = String(task.options[task.correct]).trim();
    var m = ans.match(/^(\d+)\s*/);
    if (!m) { return null; }
    var rest = ans.slice(m[0].length).trim();
    if (rest && (rest.split(/\s+/).length > 2 || /\d/.test(rest))) { return null; }
    return { num: m[1], unit: rest };
  }

  function winMain(btnEl, gems) {
    disableStage();
    if (btnEl) { btnEl.classList.add("ok"); }
    playDing();
    var r = (btnEl || document.getElementById("manswer")).getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2);
    Game.clearMistake(task.text);
    Game.addGems(gems);
    syncHud();
    attempts++;
    msg(gems > 3 ? "Правильно! +1 крок · +" + gems + " 💎 — сам, без підказок!" : "Правильно! +1 крок · +3 💎");
    revealAnswer(true);   /* розв'язок звучить одразу після задачі, ще до прикладів */
    advance();
  }

  function wrongMain(b) {
    attempts++;
    wrongAny = true;
    if (b) { b.classList.add("bad"); b.disabled = true; }
    Game.markMistake(mode, { q: task.text, a: task.options[task.correct] });
    var left = Game.loseLife();
    syncHud();
    if (left <= 0) { showOutOfLives(); }
    else { msg("Спробуй ще 🙂 ❤️ " + left, true); }
  }

  function buildMainOptions(host) {
    var items = task.options.map(function (text, i) { return { text: text, ok: i === task.correct }; });
    for (var i = items.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
    }
    host.innerHTML = '<div class="qopts" id="opts"></div>';
    var opts = document.getElementById("opts");
    var btns = [];
    items.forEach(function (item) {
      var b = document.createElement("button");
      b.className = "qopt"; b.type = "button"; b.textContent = item.text;
      b.addEventListener("click", function () {
        if (outOfLives || b.disabled) { return; }
        if (item.ok) { winMain(b, 3); }
        else { wrongMain(b); }
      });
      btns.push({ b: b, ok: item.ok });
      opts.appendChild(b);
    });
    return btns;
  }

  function renderMain() {
    var info = mainAnswerInfo();
    if (info) { renderMainInput(info); } else { renderMainText(); }
  }

  /* задачі з текстовою відповіддлю («на 280 мм», «у 4 рази») — варіанти одразу, як раніше */
  function renderMainText() {
    var stage = document.getElementById("stage");
    stage.innerHTML = '<div class="step-label">Задача</div><div class="qtitle">Обери відповідь: <span class="muted" style="font-weight:700;font-size:12px">натисни — перевіримо одразу</span></div>' +
      '<div id="mzone"></div>' +
      '<div id="assist" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px"></div>';
    buildMainOptions(document.getElementById("mzone"));
    document.getElementById("assist").appendChild(makeHintButton());
  }

  /* головна задача: спершу поле вводу; варіанти і 50:50 — за кристали */
  function renderMainInput(info) {
    var stage = document.getElementById("stage");
    var typed = "", assistSpent = 0, optsBought = false, fiftyBought = false, curBtns = [];
    stage.innerHTML =
      '<div class="step-label">Задача</div>' +
      '<div class="qtitle">Впиши відповідь — подумай сам <span class="muted" style="font-weight:700;font-size:12px">цифри, потім ✓</span></div>' +
      '<div id="mzone">' +
        '<div class="kanswer" id="manswer"></div>' +
        '<div class="kpad">' +
          [1,2,3,4,5,6,7,8,9].map(function (n) { return '<button type="button" data-k="' + n + '">' + n + '</button>'; }).join("") +
          '<button type="button" data-k="back">⌫</button><button type="button" data-k="0">0</button>' +
          '<button type="button" class="go" data-k="ok">✓</button>' +
        '</div>' +
      '</div>' +
      '<div id="assist" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px"></div>';
    var box = document.getElementById("manswer");
    var zone = document.getElementById("mzone");
    var assist = document.getElementById("assist");
    var hintBtn = makeHintButton();
    var wrongTimer = null;
    var unitHTML = info.unit ? ' <span style="color:#afafaf">' + Game.esc(info.unit) + '</span>' : "";
    function upd() {
      box.className = "kanswer";
      box.innerHTML = (typed ? Game.esc(typed) : "…") + unitHTML;
    }
    function drawAssist() {
      assist.innerHTML = "";
      assist.appendChild(hintBtn);
      var wrongLeft = curBtns.filter(function (x) { return !x.ok && document.body.contains(x.b); }).length;
      if (fiftyBought || (optsBought && wrongLeft <= 2)) { return; }
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn ghost";
      if (!optsBought) {
        b.innerHTML = "🎲 Показати 4 варіанти · 3 💎";
        b.addEventListener("click", function () {
          if (b.disabled) { return; }
          var p = Game.load();
          if (p.gems < 3) { Game.toast("Не вистачає кристалів 💎 Потренуйся — там їх заробиш!"); return; }
          Game.addGems(-3); assistSpent += 3; optsBought = true;
          submitCurrent = null;
          typed = "";
          syncHud();
          Game.toast("Варіанти відкрито · −3 💎");
          curBtns = buildMainOptions(zone);
          drawAssist();
        });
      } else {
        b.innerHTML = "✂️ Прибрати два невірні · +2 💎";
        b.addEventListener("click", function () {
          if (b.disabled) { return; }
          var p = Game.load();
          if (p.gems < 2) { Game.toast("Не вистачає кристалів 💎"); return; }
          Game.addGems(-2); assistSpent += 2; fiftyBought = true;
          syncHud();
          Game.toast("50:50 · −2 💎");
          var wrong = curBtns.filter(function (x) { return !x.ok && document.body.contains(x.b); });
          for (var i = wrong.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = wrong[i]; wrong[i] = wrong[j]; wrong[j] = t;
          }
          wrong.slice(0, 2).forEach(function (x) { x.b.remove(); });
          drawAssist();
        });
      }
      assist.appendChild(b);
    }
    Array.prototype.forEach.call(zone.querySelectorAll("[data-k]"), function (k) {
      k.addEventListener("click", function () {
        if (outOfLives || k.disabled) { return; }
        if (wrongTimer) { clearTimeout(wrongTimer); wrongTimer = null; }
        var v = k.getAttribute("data-k");
        if (v === "back") { typed = typed.slice(0, -1); }
        else if (v === "ok") { if (submitCurrent) { submitCurrent(); } return; }
        else if (typed.length < 4) { typed += v; }
        upd();
      });
    });
    submitCurrent = function () {
      if (outOfLives || !typed) { return; }
      if (typed === info.num) {
        winMain(null, assistSpent === 0 ? 5 : 3);
      } else {
        box.className = "kanswer bad";
        wrongMain(null);
        wrongTimer = setTimeout(function () { wrongTimer = null; typed = ""; upd(); }, 900);
      }
    };
    upd();
    drawAssist();
  }

  function renderNum(st) {
    var typed = "";
    var stage = document.getElementById("stage");
    stage.innerHTML = '<div class="step-label">Крок ' + (si + 1) + ' з ' + totalQuestions +
      (st.again ? ' · повторення помилки' : ' · приклад') + '</div>' +
      '<div class="kbig">' + Game.esc(st.q) + ' <span style="color:#afafaf">=</span></div>' +
      '<div class="kanswer" id="kanswer">&nbsp;</div>' +
      '<div class="kpad">' +
        [1,2,3,4,5,6,7,8,9].map(function (n) { return '<button type="button" data-k="' + n + '">' + n + '</button>'; }).join("") +
        '<button type="button" data-k="back">⌫</button><button type="button" data-k="0">0</button>' +
        '<button type="button" class="go" data-k="ok">✓</button>' +
      '</div>';
    var box = document.getElementById("kanswer");
    function upd() { box.textContent = typed || " "; box.className = "kanswer"; }
    Array.prototype.forEach.call(stage.querySelectorAll("[data-k]"), function (k) {
      k.addEventListener("click", function () {
        if (outOfLives || k.disabled) { return; }
        var v = k.getAttribute("data-k");
        if (v === "back") { typed = typed.slice(0, -1); }
        else if (v === "ok") { submitCurrent(); return; }
        else if (typed.length < 4) { typed += v; }
        upd();
      });
    });
    submitCurrent = function () {
      if (outOfLives || !typed) { return; }
      if (String(typed) === String(st.a)) {
        submitCurrent = null;
        disableStage();
        box.className = "kanswer ok";
        playDing();
        if (st.again) { Game.clearMistake(st.q); }
        Game.addGems(3);
        syncHud();
        msg("Правильно! +1 крок · +3 💎");
        advance();
      } else {
        wrongAny = true;
        box.className = "kanswer bad";
        Game.markMistake(mode, st);
        msg("Правильна відповідь: " + Game.esc(st.a), true);
        submitCurrent = null;
        disableStage();
        var again = document.createElement("div");
        again.style.cssText = "text-align:center;margin-top:12px";
        again.innerHTML = '<button type="button" class="btn" id="numNext">Далі →</button>';
        stage.appendChild(again);
        document.getElementById("numNext").addEventListener("click", advance);
      }
    };
  }

  function finishLesson() {
    disableStage();
    var perfect = !wrongAny;
    var seconds = Math.round((Date.now() - started) / 1000);
    var reward = Game.awardLesson(task.id, perfect, seconds);
    var pr = Game.load();
    var text = "Молодець! 🎉 +" + reward.xp + " XP";
    if (!reward.trophy && reward.gems) { text += " · 💎 +" + reward.gems + " за урок без помилок"; }
    if (reward.combo >= 3) { text += " · комбо x" + reward.combo + " (+" + reward.comboBonus + " XP)"; }
    var dailyGain = Game.claimTaskOfDay(task.id);
    if (dailyGain) { text += " · +" + dailyGain + " 💎 за задачу дня"; }
    msg(text);
    document.getElementById("stage").innerHTML =
      '<div class="lesson-done"><div class="big">' + (perfect ? "🏆" : "🎉") + '</div>' +
      '<h2>Урок завершено!</h2><div class="muted" style="font-weight:800">' +
      (perfect ? "Головну задачу розв'язано без помилок — ось так!" : "Задачу пройдено. Помилки додамо у повторення.") +
      '</div></div>';
    if (reward.trophy) { showTrophy(reward.trophy); }
    revealAnswer(false);   /* не повторюємо аудіо — воно вже пролунало після задачі */
    var nx = document.getElementById("next");
    var nid = Game.nextLessonId(task.id);
    nx.href = nid ? "level.html?id=" + encodeURIComponent(nid) : "index.html";
    nx.style.display = "inline-flex";
    syncHud();
    if (pr.lives <= 0) { Game.toast("Життя закінчились — віднови на карті"); }
  }

  function renderStep() {
    if (outOfLives) { return; }
    if (si >= steps.length || steps[si].type === "finish") { finishLesson(); return; }
    dots();
    if (steps[si].type === "main") { renderMain(); }
    else { renderNum(steps[si]); }
  }

  document.addEventListener("keydown", function (e) {
    if (!submitCurrent) { return; }
    if (e.key >= "0" && e.key <= "9") { e.preventDefault(); return; }
    if (e.key === "Enter") { submitCurrent(); e.preventDefault(); }
  });

  renderStep();
  if (p0.lives <= 0) { showOutOfLives(); }
  syncHud();

  document.getElementById("showAns").addEventListener("click", function () {
    var box = document.getElementById("ansbox");
    var a = document.getElementById("ansAudio");
    if (!box.classList.contains("show")) {
      box.classList.add("show");
      this.textContent = "🙈 Сховати розв'язок";
      try { a.currentTime = 0; var pr = a.play(); if (pr && pr.catch) { pr.catch(function () {}); } } catch (e) {}
    } else {
      box.classList.remove("show");
      this.textContent = "💡 Показати розв'язок";
      try { a.pause(); } catch (e) {}
    }
  });

  function showTrophy(t) {
    var ov = document.createElement("div");
    ov.className = "modal";
    ov.innerHTML = '<div class="modal-card trophy-card">' +
      '<div class="modal-glow"></div>' +
      '<img class="modal-art" src="art/icon_trophy.webp?v=20261125i" alt="">' +
      '<div class="modal-kicker">Кубок розділу</div>' +
      '<h2>' + Game.esc(t.title) + '</h2>' +
      '<div class="modal-sub">Розділ пройдено повністю!</div>' +
      '<div class="modal-reward"><img src="art/icon_gem.webp?v=20261125i" class="ico" alt=""> +15</div>' +
      '<button class="btn modal-btn" id="trophyOk">Забрати кубок</button></div>';
    document.body.appendChild(ov);
    try { document.getElementById("ding").play(); } catch (e) {}
    function close() { ov.remove(); }
    document.getElementById("trophyOk").addEventListener("click", close);
    ov.addEventListener("click", function (e) { if (e.target === ov) { close(); } });
    document.addEventListener("keydown", function esc(e) {
      if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
    });
  }

  syncHud();
})();
</script>
</body>
</html>
