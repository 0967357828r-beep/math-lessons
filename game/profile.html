<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профіль — Тімолінго</title>
<link rel="stylesheet" href="game.css?v=20261118q">
</head>
<body>
<div class="story-deco" aria-hidden="true"><span>🍄</span><span>🌿</span><span>✨</span></div>
<div class="league-bg page-city page-profile" id="pageCity" aria-hidden="true"></div>
<aside class="side" id="side"></aside>

<main class="main">
  <div class="wrap">
    <div class="hud" id="hud"></div>
    <div id="profile"></div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="tasks.js?v=20261118q"></script>
<script src="avatars.js?v=20261118q"></script>
<script src="game.js?v=20261118q"></script>
<script>
(function () {
  var EMOJI = ["🐸", "🦎", "🐛", "🐌", "🦋", "🐞", "🐢", "🐝", "🦊", "🐼", "🦄", "🐙", "🚀", "🌟"];
  var AVATARS = (window.AVATARS && window.AVATARS.length) ? window.AVATARS : EMOJI.map(function (e) {
    return { id: e, name: e, file: e };
  });

  function avatarHTML(a, size, radius) {
    if (a && String(a).indexOf("/") > -1) {
      return '<img src="' + Game.esc(a) + '?v=20261118q" alt="" style="width:' + size + 'px;height:' + size + 'px;' +
             'border-radius:' + (radius || "50%") + ';object-fit:cover;display:block">';
    }
    return a || "🐸";
  }
  Game.renderSidebar("profile");
  document.getElementById("hud").innerHTML = Game.hudHTML();
  (function () {
    var lg = Game.leagueOf(Game.load());
    var city = document.getElementById("pageCity");
    if (city) {
      city.style.backgroundImage = 'url("' + lg.cur.city + '?v=20261118q")';
    }
  })();

  var MONTHS = ["січня", "лютого", "березня", "квітня", "травня", "червня",
                "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
  function dateUa(iso) {
    var p2 = iso.split("-");
    return (+p2[2]) + " " + MONTHS[(+p2[1]) - 1] + " " + p2[0];
  }
  function daysJoined(iso) {
    var a = new Date(iso + "T00:00:00"), b = new Date(Game.todayStr() + "T00:00:00");
    return Math.max(1, Math.round((b - a) / 86400000) + 1);
  }

  function render() {
    var p = Game.load();
    Game.save(p);
    var lg = Game.leagueOf(p);
    var ach = Game.achievements(p);
    var host = document.getElementById("profile");
    var doneLevels = Object.keys(p.levels).filter(function (k) { return p.levels[k].done; }).length;
    var acc = p.profile.accessory ? Game.SHOP.filter(function (x) { return x.id === p.profile.accessory; })[0] : null;
    var showHeroAcc = acc && String(p.profile.avatar).indexOf("art/avatar_") !== 0;

    var html = '<div class="hero"><div class="avatar">' + avatarHTML(p.profile.avatar, 128) +
      (showHeroAcc ? '<span class="hero-acc">' + Game.shopIconHTML(acc, 52) + '</span>' : '') + '</div>' +
      '<button class="edit" id="editAvatar">✏️ Змінити</button></div>' +
      '<h1 class="profile-name" id="pname">' + Game.esc(p.profile.name) + '</h1>' +
      '<div class="profile-sub">З нами з ' + dateUa(p.profile.joined) + ' · ' + daysJoined(p.profile.joined) +
      ' дн. · пройдено ' + doneLevels + ' із ' + Game.SEQ.length + ' уроків</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="si">🔥</div><div><b>' + p.streak + '</b><span>денна серія</span></div></div>' +
        '<div class="stat"><div class="si">⚡</div><div><b>' + p.xp + '</b><span>усього балів</span></div></div>' +
        '<div class="stat"><div class="si"><img class="league-crest sm" src="' + lg.cur.crest + '?v=20261118q" alt=""></div><div><b>' + lg.cur.name + '</b><span>поточна ліга</span></div></div>' +
        '<div class="stat"><div class="si">💎</div><div><b>' + p.gems + '</b><span>кристали</span></div></div>' +
      '</div>' +

      '<div class="card" style="margin-bottom:18px">' +
        '<h3>Досягнення <a class="more" href="quests.html">квести</a></h3>';
    ach.forEach(function (a) {
      var pct = Math.min(100, Math.round(a.now / a.goal * 100));
      var badge = a.level > 0 ? "Рівень " + a.level : "Нове";
      html += '<div class="ach"><div class="ai' + (a.level ? " on" : "") + '">' +
              a.icon + '</div><div class="am"><div class="at">' + a.title +
              '<span>' + a.now + ' / ' + a.goal + '</span></div>' +
              '<div class="ad">' + a.desc + ' · ' + badge + '</div>' +
              '<div class="bar"><i style="width:' + pct + '%"></i></div></div></div>';
    });
    var MODE_LABEL = { add: "Додавання", sub: "Віднімання", mul: "Множення", div: "Ділення",
                       big: "Великі числа", chain: "Три дії", times: "Двоцифрові", mix: "Мішане", cmp: "Порівняння" };
    var weakCount = {};
    Game.mistakes(p).forEach(function (m) { if (m.mode) { weakCount[m.mode] = (weakCount[m.mode] || 0) + 1; } });
    var weak = Object.keys(weakCount).sort(function (a, b) { return weakCount[b] - weakCount[a]; }).slice(0, 4);
    var weakHtml = weak.length
      ? weak.map(function (k) {
          return '<div class="quest"><div class="qi">🎯</div><div class="qm"><div class="qt">' +
                 (MODE_LABEL[k] || k) + '</div><div class="muted" style="font-size:11px;font-weight:700">помилок: ' +
                 weakCount[k] + '</div></div></div>';
        }).join("")
      : '<div class="muted" style="font-size:13px;font-weight:700">Поки що без помилок — так тримати! 🌟</div>';

    var shopHtml = Game.avatarShop().map(function (a) {
      var label = a.selected ? "Обрано" : a.owned ? "Обрати" : ("💎 " + a.price);
      var cls = a.selected ? "btn" : "btn ghost";
      return '<div class="shop-item avatar-item' + (a.selected ? " on" : "") + '">' +
             '<img class="shop-avatar" src="' + Game.esc(a.file) + '?v=20261118q" alt="">' +
             '<div class="sn">' + (a.name ? Game.esc(a.name) : "&nbsp;") + '</div>' +
             '<button class="' + cls + '" data-avatar="' + Game.esc(a.file) + '" data-price="' + a.price + '"' +
             (a.selected ? " disabled" : "") + '>' + label + '</button></div>';
    }).join("");

    html += '</div><div class="card" style="margin-bottom:18px"><h3>Слабкі місця <span class="more">для тата</span></h3>' +
            weakHtml + '</div>' +

      '<div class="card" style="margin-bottom:18px"><h3>Крамниця аватарів <span class="more">💎 ' +
            p.gems + '</span></h3><div class="shop-grid">' + shopHtml + '</div></div>' +

      '<div class="card" style="margin-bottom:18px"><h3>' + lg.cur.name + ' ліга' +
      ' <a class="more" href="leaderboard.html">дошка</a></h3>' +
      '<div class="league-city" style="background-image:linear-gradient(180deg,rgba(18,14,11,.15),rgba(18,14,11,.75)),url(\'' +
      lg.cur.city + '?v=20261118q\')"></div>' +
      '<div class="league-row"><div class="league-badge"><img class="league-crest" src="' +
      lg.cur.crest + '?v=20261118q" alt=""></div><div><b>' + p.xp + ' XP усього</b>' +
      '<div class="muted">' + (lg.next ? "До ліги «" + lg.next.name + "»: " + (lg.next.need - p.xp) + " XP" : "Найвища ліга!") +
      '</div></div></div>' +
      '<div class="bar" style="margin-top:12px"><i style="width:' + Math.round(lg.pct * 100) + '%;background:' +
      lg.cur.color + '"></i></div></div>' +

      '<div class="tools">' +
        '<button class="btn ghost" id="rename">✏️ Імʼя</button>' +
        '<button class="btn ghost" id="shareCode">🔗 Код прогресу</button>' +
        '<button class="btn ghost" id="useCode">⌨️ Ввести код</button>' +
        '<button class="btn ghost" id="export">⬇️ Зберегти прогрес</button>' +
        '<button class="btn ghost" id="import">⬆️ Завантажити</button>' +
        '<button class="btn danger" id="reset">♻️ Скинути</button>' +
      '</div>';

    host.innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("[data-avatar]"), function (b) {
      b.addEventListener("click", function () {
        var file = b.getAttribute("data-avatar");
        var price = +b.getAttribute("data-price") || 0;
        var p0 = Game.load();
        if (price > 0 && p0.ownedAvatars.indexOf(file) < 0) {
          var r = Game.buyAvatar(file);
          if (!r || r.error === "gems") {
            Game.toast("Не вистачає кристалів — треба " + price);
            return;
          }
        }
        Game.selectAvatar(file);
        Game.toast("Аватар обрано");
        render();
        Game.renderSidebar("profile");
        var hud = document.getElementById("hud");
        if (hud) { hud.innerHTML = Game.hudHTML(); }
      });
    });

    document.getElementById("editAvatar").addEventListener("click", function () {
      var p2 = Game.load();
      var pick = document.createElement("div");
      pick.className = "modal";
      var box = document.createElement("div");
      box.className = "modal-card pick-card";
      box.innerHTML = '<h3>Обери персонажа</h3>' +
        '<div id="avGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div>';
      var grid = box.querySelector("#avGrid");
      AVATARS.forEach(function (a) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "av-pick";
        b.innerHTML = avatarHTML(a.file, 58, "12px") +
          '<span class="av-name">' + Game.esc(a.name) + '</span>';
        b.addEventListener("click", function () {
          var pp = Game.load(); pp.profile.avatar = a.file; pp.profile.baseAvatar = a.file;
          pp.profile.accessory = null; Game.save(pp);
          pick.remove(); render(); Game.renderSidebar("profile");
        });
        grid.appendChild(b);
      });
      pick.appendChild(box);
      pick.addEventListener("click", function (e) { if (e.target === pick) { pick.remove(); } });
      document.body.appendChild(pick);
    });

    document.getElementById("rename").addEventListener("click", function () {
      var name = prompt("Як тебе звати?", p.profile.name);
      if (name) {
        var pp = Game.load(); pp.profile.name = name.slice(0, 20); Game.save(pp);
        render(); Game.renderSidebar("profile");
      }
    });

    document.getElementById("shareCode").addEventListener("click", function () {
      try {
        var raw = JSON.stringify(Game.load());
        var code = "TIM1:" + btoa(unescape(encodeURIComponent(raw)));
        window.prompt("Скопіюй код для іншого пристрою:", code);
      } catch (e) { Game.toast("Не вдалося створити код"); }
    });
    document.getElementById("useCode").addEventListener("click", function () {
      var code = window.prompt("Введи код прогресу:");
      if (!code) { return; }
      try {
        code = code.replace(/^TIM1:/, "").trim();
        var clean = Game.sanitize(JSON.parse(decodeURIComponent(escape(atob(code)))));
        if (!clean) { throw new Error("bad profile"); }
        localStorage.setItem(Game.KEY, JSON.stringify(clean));
        render(); Game.renderSidebar("profile"); Game.toast("Прогрес завантажено");
      } catch (e) { Game.toast("Код не підходить"); }
    });

    document.getElementById("reset").addEventListener("click", function () {
      if (confirm("Скинути весь прогрес?")) { localStorage.removeItem(Game.KEY); render(); Game.renderSidebar("profile"); }
    });
    document.getElementById("export").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(Game.load(), null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "math-lessons-progress.json"; a.click();
      Game.toast("Файл прогресу збережено");
    });
    document.getElementById("import").addEventListener("click", function () {
      var inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";
      inp.addEventListener("change", function () {
        var f = inp.files[0]; if (!f) { return; }
        var r = new FileReader();
        r.onload = function () {
          try {
            var clean = Game.sanitize(JSON.parse(r.result));
            if (!clean) { throw new Error("bad profile"); }
            localStorage.setItem(Game.KEY, JSON.stringify(clean));
            render(); Game.renderSidebar("profile"); Game.toast("Прогрес завантажено");
          } catch (e) { Game.toast("Не вдалося прочитати файл"); }
        };
        r.readAsText(f);
      });
      inp.click();
    });
  }

  render();
})();
</script>
</body>
</html>
