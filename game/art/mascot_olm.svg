<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360" role="img" aria-label="Ненька Олм — анімований персонаж">
<style>
  .lid, .lid2 { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); animation: olmBlink 4.6s infinite; }
  .lid2 { animation-delay: .07s; }
  @keyframes olmBlink { 0%, 91%, 93%, 100% { transform: scaleY(0); } 92% { transform: scaleY(1); } }
  .mouth-open { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(.02); animation: olmTalk 9s infinite; }
  .smile { animation: olmSmile 9s infinite; }
  @keyframes olmTalk {
    0%, 57%, 88%, 100% { transform: scaleY(.02); }
    60% { transform: scaleY(1); } 63% { transform: scaleY(.35); }
    66% { transform: scaleY(1); } 69% { transform: scaleY(.3); }
    72% { transform: scaleY(.95); } 75% { transform: scaleY(.25); }
    78% { transform: scaleY(1); } 81% { transform: scaleY(.4); }
    84% { transform: scaleY(.9); }
  }
  @keyframes olmSmile { 0%, 57%, 88%, 100% { opacity: 1; } 60%, 85% { opacity: 0; } }
  .gill { transform-box: fill-box; transform-origin: 50% 100%; animation: olmSway 2.8s ease-in-out infinite alternate; }
  .gill.r { animation-delay: -.9s; }
  .gill2 { animation-delay: -.45s; }
  @keyframes olmSway { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) {
    .lid, .lid2, .mouth-open, .smile, .gill { animation: none; }
    .mouth-open { transform: scaleY(.02); }
  }
</style>

